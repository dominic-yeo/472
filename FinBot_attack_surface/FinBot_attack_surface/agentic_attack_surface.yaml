agentic:
  schema: Agentic_attack_surface_schema.yaml
  agents:
    - id: agent.vendor_chat
      name: Vendor Chat Assistant
      component: Vendor Portal / agent runtime
      agent_kind: interactive
      purpose: Answer current vendor questions, look up scoped business records, and start delegated workflows.
      invocation_surfaces: [{l1_id: l1.vendor.chat, trigger: Vendor chat POST, auth_context: session and current vendor context}]
      model_config: {provider: settings-backed LLM client, model: settings.LLM_DEFAULT_MODEL, deployment: environment configured, version: unknown, config_source: finbot/agents/chat.py and finbot/config.py, evidence_status: source_confirmed}
      instruction_sources: [{surface_id: ctx.system_prompts, instruction_role: system, precedence: first model input message, config_version: source code revision}]
      tool_binding_ids: [tb.vendor.native, tb.vendor.findrive, tb.vendor.finmail, tb.vendor.systemutils]
      context_source_ids: [ctx.system_prompts, ctx.user_message, ctx.chat_history, ctx.business_tool_results, ctx.mcp_descriptions]
      memory_ids: [mem.chat_history, mem.workflow_context]
      control_ids: [control.session_context, control.csrf, control.agent_hooks]
      authority_context: {principal_source: SessionContext from signed session cookie, tenant_scope: namespace, resource_scope: current vendor for vendor-native data operations, delegated_identity: same SessionContext passed to tool callables and child workflow, authz_enforcement: route/repository/tool code; per-tool behavior is source-defined}
      related_l2_ids: [l2.vendor.chat, l2.vendor.files, l2.vendor.payments, l2.vendor.email]
      source_ref: finbot/agents/chat.py::VendorChatAssistant
      evidence_status: source_confirmed
      notes: Chat UI is present in source; live chat invocation and deployment model connectivity were not tested.

    - id: agent.finance_copilot
      name: Finance Co-Pilot
      component: Admin Portal / agent runtime
      agent_kind: interactive
      purpose: Analyze namespace vendor, invoice, payment, inbox, compliance, and file data; prepare reports and start workflows.
      invocation_surfaces: [{l1_id: l1.admin.copilot_chat, trigger: Admin Co-Pilot chat POST, auth_context: session and namespace context}]
      model_config: {provider: settings-backed LLM client, model: settings.LLM_DEFAULT_MODEL, deployment: environment configured, version: unknown, config_source: finbot/agents/chat.py and finbot/config.py, evidence_status: source_confirmed}
      instruction_sources: [{surface_id: ctx.system_prompts, instruction_role: system, precedence: first model input message, config_version: source code revision}]
      tool_binding_ids: [tb.copilot.native, tb.copilot.findrive, tb.copilot.finmail, tb.copilot.systemutils]
      context_source_ids: [ctx.system_prompts, ctx.user_message, ctx.chat_history, ctx.business_tool_results, ctx.mcp_descriptions]
      memory_ids: [mem.chat_history, mem.workflow_context, mem.file_data]
      control_ids: [control.session_context, control.csrf, control.agent_hooks]
      authority_context: {principal_source: SessionContext from signed session cookie, tenant_scope: namespace, resource_scope: namespace vendor and business records, delegated_identity: same SessionContext passed into tools and workflows, authz_enforcement: repository and tool code with namespace context}
      related_l2_ids: [l2.admin.copilot, l2.admin.files, l2.admin.email, l2.admin.mcp_config]
      source_ref: finbot/agents/chat.py::CoPilotAssistant
      evidence_status: source_confirmed
      notes: Admin Co-Pilot page rendered live; no prompt was submitted and no tool invocation was triggered.

    - id: agent.orchestrator
      name: Workflow Orchestrator
      component: Agent runtime
      agent_kind: orchestrator
      purpose: Select and coordinate specialized agents for onboarding, invoice, fraud/compliance, payment, communication, and system maintenance tasks.
      invocation_surfaces:
        - {l1_id: l1.vendor.register, trigger: background task after vendor creation, auth_context: originating SessionContext}
        - {l1_id: l1.vendor.create_invoice, trigger: background task after invoice creation, auth_context: originating SessionContext}
        - {l1_id: l1.vendor.reprocess_invoice, trigger: background task after reprocess request, auth_context: originating SessionContext}
        - {l1_id: l1.vendor.request_review, trigger: background task after review request, auth_context: originating SessionContext}
        - {l1_id: l1.vendor.chat, trigger: chat start_workflow native tool, auth_context: originating SessionContext}
        - {l1_id: l1.admin.copilot_chat, trigger: Co-Pilot start_workflow native tool, auth_context: originating SessionContext}
      model_config: {provider: settings-backed agent LLM client, model: runtime configured, deployment: environment configured, version: unknown, config_source: finbot/agents/base.py; finbot/config.py, evidence_status: source_confirmed}
      instruction_sources: [{surface_id: ctx.system_prompts, instruction_role: system, precedence: base agent model prompt, config_version: source code revision}]
      tool_binding_ids: [tb.orchestrator.delegation]
      context_source_ids: [ctx.system_prompts, ctx.workflow_task, ctx.delegated_summaries, ctx.business_tool_results]
      memory_ids: [mem.workflow_context, mem.vendor_data, mem.invoice_data]
      control_ids: [control.session_context, control.agent_retry]
      authority_context: {principal_source: originating SessionContext, tenant_scope: namespace, resource_scope: task vendor/invoice identifiers and tools provided to child agents, delegated_identity: same session passed to runner functions, authz_enforcement: agent tools and repository code}
      related_l2_ids: [l2.vendor.register, l2.vendor.review, l2.vendor.invoices, l2.vendor.payments, l2.vendor.chat, l2.admin.copilot]
      source_ref: finbot/agents/orchestrator.py; finbot/agents/runner.py
      evidence_status: source_confirmed
      notes: System maintenance is a task mode routed through FraudComplianceAgent with SystemUtils, not a separate instantiated agent class.

    - id: agent.onboarding
      name: Vendor Onboarding Agent
      component: Agent runtime
      agent_kind: specialist
      purpose: Read vendor profile data and produce/update onboarding status and related notes.
      invocation_surfaces: [{l1_id: l1.vendor.register, trigger: Orchestrator delegation, auth_context: originating SessionContext}]
      model_config: {provider: settings-backed agent LLM client, model: runtime configured, deployment: environment configured, version: unknown, config_source: finbot/agents/specialized/onboarding.py; finbot/config.py, evidence_status: source_confirmed}
      instruction_sources: [{surface_id: ctx.system_prompts, instruction_role: system, precedence: base agent model prompt, config_version: source code revision}]
      tool_binding_ids: [tb.onboarding.native]
      context_source_ids: [ctx.system_prompts, ctx.workflow_task, ctx.business_tool_results, ctx.delegated_summaries]
      memory_ids: [mem.vendor_data, mem.workflow_context]
      control_ids: [control.session_context, control.agent_retry]
      authority_context: {principal_source: originating SessionContext, tenant_scope: namespace, resource_scope: vendor_id in delegated task, delegated_identity: originating session, authz_enforcement: repository/tool code}
      related_l2_ids: [l2.vendor.register, l2.vendor.review]
      source_ref: finbot/agents/specialized/onboarding.py
      evidence_status: source_confirmed
      notes: Native tools read vendor details and update vendor status; no separate MCP server is configured by this class.

    - id: agent.invoice
      name: Invoice Processing Agent
      component: Agent runtime
      agent_kind: specialist
      purpose: Read invoice/vendor/file context, evaluate invoice processing, and update status and processing notes.
      invocation_surfaces: [{l1_id: l1.vendor.create_invoice, trigger: Orchestrator delegation, auth_context: originating SessionContext}]
      model_config: {provider: settings-backed agent LLM client, model: runtime configured, deployment: environment configured, version: unknown, config_source: finbot/agents/specialized/invoice.py; finbot/config.py, evidence_status: source_confirmed}
      instruction_sources: [{surface_id: ctx.system_prompts, instruction_role: system, precedence: base agent model prompt, config_version: source code revision}]
      tool_binding_ids: [tb.invoice.native, tb.invoice.findrive, tb.invoice.taxcalc]
      context_source_ids: [ctx.system_prompts, ctx.workflow_task, ctx.business_tool_results, ctx.file_content, ctx.mcp_descriptions]
      memory_ids: [mem.invoice_data, mem.file_data, mem.workflow_context]
      control_ids: [control.session_context, control.agent_retry]
      authority_context: {principal_source: originating SessionContext, tenant_scope: namespace, resource_scope: invoice_id/vendor_id and referenced attachment file IDs, delegated_identity: originating session, authz_enforcement: agent tools/repository code}
      related_l2_ids: [l2.vendor.invoices, l2.vendor.files, l2.vendor.payments]
      source_ref: finbot/agents/specialized/invoice.py
      evidence_status: source_confirmed
      notes: Connects to TaxCalc and FinDrive when enabled for the namespace.

    - id: agent.fraud_compliance
      name: Fraud and Compliance Agent
      component: Agent runtime
      agent_kind: specialist
      purpose: Assess vendor/invoice risk and compliance context; also services system maintenance tasks when delegated in that mode.
      invocation_surfaces: [{l1_id: l1.vendor.register, trigger: Orchestrator delegation, auth_context: originating SessionContext}]
      model_config: {provider: settings-backed agent LLM client, model: runtime configured, deployment: environment configured, version: unknown, config_source: finbot/agents/specialized/fraud.py; finbot/config.py, evidence_status: source_confirmed}
      instruction_sources: [{surface_id: ctx.system_prompts, instruction_role: system, precedence: base agent model prompt, config_version: source code revision}]
      tool_binding_ids: [tb.fraud.native, tb.fraud.findrive, tb.fraud.finmail, tb.fraud.systemutils]
      context_source_ids: [ctx.system_prompts, ctx.workflow_task, ctx.business_tool_results, ctx.file_content, ctx.mcp_descriptions, ctx.delegated_summaries]
      memory_ids: [mem.vendor_data, mem.invoice_data, mem.file_data, mem.workflow_context]
      control_ids: [control.session_context, control.agent_retry]
      authority_context: {principal_source: originating SessionContext, tenant_scope: namespace, resource_scope: vendor_id/invoice_id plus tools enabled for namespace, delegated_identity: originating session, authz_enforcement: agent tools/repository code}
      related_l2_ids: [l2.vendor.register, l2.vendor.review, l2.vendor.invoices, l2.vendor.files]
      source_ref: finbot/agents/specialized/fraud.py; finbot/agents/orchestrator.py
      evidence_status: source_confirmed
      notes: The orchestrator labels one delegation System Maintenance Agent but invokes this class and prefixes the task description with that mode.

    - id: agent.payments
      name: Payments Agent
      component: Agent runtime
      agent_kind: specialist
      purpose: Read invoice/vendor/payment context and process eligible payment tasks through FinStripe.
      invocation_surfaces: [{l1_id: l1.vendor.create_invoice, trigger: Orchestrator delegation following invoice processing, auth_context: originating SessionContext}]
      model_config: {provider: settings-backed agent LLM client, model: runtime configured, deployment: environment configured, version: unknown, config_source: finbot/agents/specialized/payments.py; finbot/config.py, evidence_status: source_confirmed}
      instruction_sources: [{surface_id: ctx.system_prompts, instruction_role: system, precedence: base agent model prompt, config_version: source code revision}]
      tool_binding_ids: [tb.payments.native, tb.payments.finstripe, tb.payments.taxcalc]
      context_source_ids: [ctx.system_prompts, ctx.workflow_task, ctx.business_tool_results, ctx.mcp_descriptions, ctx.delegated_summaries]
      memory_ids: [mem.invoice_data, mem.vendor_data, mem.payment_data, mem.workflow_context]
      control_ids: [control.session_context, control.agent_retry]
      authority_context: {principal_source: originating SessionContext, tenant_scope: namespace, resource_scope: invoice_id/vendor_id in task data, delegated_identity: originating session, authz_enforcement: agent tools and repository code}
      related_l2_ids: [l2.vendor.payments, l2.vendor.invoices]
      source_ref: finbot/agents/specialized/payments.py
      evidence_status: source_confirmed
      notes: Connects to FinStripe and TaxCalc when enabled for the namespace.

    - id: agent.communication
      name: Communication Agent
      component: Agent runtime
      agent_kind: specialist
      purpose: Compose business notifications and route them through FinMail to vendor/admin inboxes or configured external email delivery.
      invocation_surfaces: [{l1_id: l1.vendor.register, trigger: Orchestrator delegation, auth_context: originating SessionContext}]
      model_config: {provider: settings-backed agent LLM client, model: runtime configured, deployment: environment configured, version: unknown, config_source: finbot/agents/specialized/communication.py; finbot/config.py, evidence_status: source_confirmed}
      instruction_sources: [{surface_id: ctx.system_prompts, instruction_role: system, precedence: base agent model prompt, config_version: source code revision}]
      tool_binding_ids: [tb.communication.native, tb.communication.finmail]
      context_source_ids: [ctx.system_prompts, ctx.workflow_task, ctx.business_tool_results, ctx.mcp_descriptions, ctx.delegated_summaries]
      memory_ids: [mem.email_data, mem.workflow_context]
      control_ids: [control.session_context, control.agent_retry]
      authority_context: {principal_source: originating SessionContext, tenant_scope: namespace, resource_scope: vendor recipient and message fields in delegated task, delegated_identity: originating session, authz_enforcement: agent tools and FinMail routing code}
      related_l2_ids: [l2.vendor.email, l2.admin.email, l2.vendor.register, l2.vendor.invoices, l2.vendor.payments]
      source_ref: finbot/agents/specialized/communication.py
      evidence_status: source_confirmed

