      owner_component: "SessionManager / UserSession (finbot/core/auth/session.py)"
      readers: ["SessionMiddleware for every request"]
      writers:
        - {principal: SessionMiddleware, l1_id: null}
        - {principal: user, l1_id: root.auth.magic_link_verify}
        - {principal: vendor, l1_id: vendor.api.vendors.switch}
      scope: session
      isolation_enforcement: "signed session cookie with fingerprint protection"
      write_provenance: "middleware-created temporary sessions; magic-link verification; vendor context switch"
      read_path: "cookie -> SessionContext (namespace, user_id, current_vendor_id, portal_type, csrf token)"
      retention_and_deletion: "session expiry/rotation; logout"
      related_l2_ids: [auth.bind_session_to_email, vendor.switch_active_context]
      evidence_status: observed
      visibility: black_box_observable
      reachability: {status: black_box_reachable, notes: "/api/session/status returned namespace, temporary flag and CSRF token live."}
      source_ref: "finbot/core/auth/session.py; finbot/core/auth/middleware.py"

