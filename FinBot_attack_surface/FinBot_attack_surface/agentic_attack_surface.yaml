# Agentic attack-surface inventory for FinBot.
# Schema: FinBot_attack_surface/Agentic_attack_surface_schema.yaml
#
# Verification basis:
#   - Source: repository at commit 1450fc4 (main).
#   - Live: https://owasp-finbot-ctf.org, 2026-09-24, fresh temporary session
#     (namespace ns_user_*). Read-only GETs plus one CSRF-less POST that was
#     rejected. No chat prompt was submitted, so no LLM call or tool call was
#     exercised live. Note: GET /darklab/api/v1/supply-chain/servers seeds
#     default MCP config rows for the caller's namespace on first read.
#   - evidence_status "observed" = confirmed live; "source_confirmed" = read in
#     source only.
#
# Cross-cutting facts:
#   - Every agent receives the originating SessionContext. Repository access is
#     namespace-scoped (NamespacedRepository). Native agent tools take
#     LLM-supplied vendor_id/invoice_id and do NOT check them against
#     current_vendor_id (unlike the vendor REST routes).
#   - Chat assistants call the OpenAI Responses API directly (AsyncOpenAI);
#     orchestrator and specialists use ContextualLLMClient, which honours
#     LLM_PROVIDER (openai | ollama | mock). Default model: gpt-5-nano.
#   - All five MCP servers are in-process FastMCP instances created per agent run
#     by finbot/mcp/factory.py. A namespace with no config row gets the server
#     with default config (enabled). Live: all five enabled, no tool overrides.

agentic:
  schema: Agentic_attack_surface_schema.yaml

  agents:
    - id: agent.vendor_chat
      name: Vendor Chat Assistant
      component: vendor
      agent_kind: interactive
      purpose: Answer vendor questions, look up records, read/send FinMail, read/write FinDrive, and start background workflows.
      invocation_surfaces:
        - {l1_id: vendor.api.chat.send, trigger: "POST /vendor/api/v1/chat (SSE stream)", auth_context: "session:temporary; current_vendor_id loaded for /vendor requests"}
      model_config:
        provider: "OpenAI Responses API via AsyncOpenAI (ignores LLM_PROVIDER)"
        model: "settings.LLM_DEFAULT_MODEL (default gpt-5-nano)"
        deployment: "OPENAI_API_KEY from environment; CHAT_STREAM_TIMEOUT"
        version: unknown
        config_source: "finbot/agents/chat.py:69-73; finbot/config.py:98-110"
        writers: []
        evidence_status: source_confirmed
      instruction_sources:
        - {surface_id: ctx.system_prompts, instruction_role: system, precedence: "first input message; rebuilt every request", config_version: "source revision 1450fc4", writers: []}
      tool_binding_ids: [tb.vendor.native, tb.vendor.findrive, tb.vendor.finmail, tb.vendor.systemutils]
      context_source_ids: [ctx.system_prompts, ctx.chat_user_message, ctx.chat_history, ctx.business_tool_results, ctx.file_content, ctx.email_content, ctx.mcp_descriptions]
      memory_ids: [mem.chat_history, mem.vendor_data, mem.invoice_data, mem.payment_data, mem.file_data, mem.email_data, mem.agent_events]
      output_sink_ids: [sink.vendor_chat_stream, sink.finmail_inbox, sink.finmail_dead_drop, sink.guardrail_webhook, sink.agent_event_bus]
      control_ids: [control.session_context, control.csrf, control.guardrail_hooks, control.iteration_limits, control.mcp_enabled_state]
      authority_context:
        principal_source: "SessionContext from session cookie (temporary sessions allowed)"
        tenant_scope: namespace
        resource_scope: "Native tools: any vendor/invoice in the namespace (vendor_id is LLM-supplied, no current-vendor check). FinDrive: all files except vendor_id NULL (admin) files. FinMail: current vendor's inbox only."
        delegated_identity: "Same SessionContext passed to tools and to start_workflow's orchestrator run"
        authz_enforcement: "code: namespace filter in repositories; FinDrive/FinMail vendor-session checks in MCP server code. The prompt's 'current vendor ID' line is guidance only."
      related_l2_ids: [chat.vendor_assistant_conversation, chat.trigger_background_workflow, communication.agent_initiated_notification, findrive.store_and_retrieve_document, findrive.cross_vendor_file_access_via_agent]
      visibility: black_box_observable
      reachability: {status: black_box_reachable, notes: "Endpoint live; CSRF-less POST returns 403. /vendor/assistant redirects (302) until a vendor exists. No prompt submitted, so LLM availability not confirmed."}
      source_ref: "finbot/agents/chat.py:511-723; finbot/apps/vendor/routes/api.py:1169-1196"
      evidence_status: observed
      notes: "Up to 15 model/tool rounds per message. Attachments are prepended to the message as '[User attached FinDrive files: ...]'. MCP connection failures are swallowed; the assistant continues with native tools only."

    - id: agent.finance_copilot
      name: Finance Co-Pilot
      component: admin
      agent_kind: interactive
      purpose: Cross-vendor analysis, inbox review, report generation to FinDrive, SystemUtils operations, and workflow starts for the admin portal.
      invocation_surfaces:
        - {l1_id: admin.api.copilot.chat, trigger: "POST /admin/api/v1/copilot/chat (SSE stream)", auth_context: "session:temporary; no admin role check; current_vendor_id is None"}
      model_config:
        provider: "OpenAI Responses API via AsyncOpenAI (ignores LLM_PROVIDER)"
        model: "settings.LLM_DEFAULT_MODEL (default gpt-5-nano)"
        deployment: "OPENAI_API_KEY from environment"
        version: unknown
        config_source: "finbot/agents/chat.py:69-73; finbot/config.py:98-110"
        writers: []
        evidence_status: source_confirmed
      instruction_sources:
        - {surface_id: ctx.system_prompts, instruction_role: system, precedence: "first input message; rebuilt every request", config_version: "source revision 1450fc4", writers: []}
      tool_binding_ids: [tb.copilot.native, tb.copilot.findrive, tb.copilot.finmail, tb.copilot.systemutils]
      context_source_ids: [ctx.system_prompts, ctx.chat_user_message, ctx.chat_history, ctx.business_tool_results, ctx.file_content, ctx.email_content, ctx.mcp_descriptions]
      memory_ids: [mem.chat_history, mem.vendor_data, mem.invoice_data, mem.payment_data, mem.file_data, mem.email_data, mem.agent_events]
      output_sink_ids: [sink.copilot_chat_stream, sink.findrive_reports, sink.finmail_inbox, sink.finmail_dead_drop, sink.guardrail_webhook, sink.agent_event_bus]
      control_ids: [control.session_context, control.csrf, control.guardrail_hooks, control.iteration_limits, control.mcp_enabled_state]
      authority_context:
        principal_source: "SessionContext from session cookie (temporary sessions allowed)"
        tenant_scope: namespace
        resource_scope: "All vendors, invoices, payments, FinDrive files and admin/vendor inboxes in the namespace"
        delegated_identity: "Same SessionContext passed to tools and to start_workflow's orchestrator run"
        authz_enforcement: "code: namespace filter only; admin portal has no role check"
      related_l2_ids: [chat.copilot_conversation_and_reporting, chat.trigger_background_workflow, invoice.compliance_document_review, communication.agent_initiated_notification, findrive.store_and_retrieve_document]
      visibility: black_box_observable
      reachability: {status: black_box_reachable, notes: "Live: /admin/dashboard (loads copilot.js) and /admin/api/v1/copilot/history return 200 for a fresh temporary session. No prompt submitted."}
      source_ref: "finbot/agents/chat.py:731-1140; finbot/apps/admin/routes/api.py:501-545"
      evidence_status: observed
      notes: "Same 15-round loop and MCP handling as the vendor assistant."

    - id: agent.orchestrator
      name: Workflow Orchestrator
      component: agent
      agent_kind: orchestrator
      purpose: Match a task to a workflow recipe and delegate to specialist agents in sequence, passing prior results forward.
      invocation_surfaces:
        - {l1_id: vendor.api.vendors.register, trigger: "BackgroundTasks after vendor creation", auth_context: "originating SessionContext"}
        - {l1_id: vendor.api.vendors.request_review, trigger: "BackgroundTasks after review request", auth_context: "originating SessionContext"}
        - {l1_id: vendor.api.invoices.create, trigger: "BackgroundTasks after invoice creation", auth_context: "originating SessionContext"}
        - {l1_id: vendor.api.invoices.reprocess, trigger: "BackgroundTasks after reprocess request", auth_context: "originating SessionContext"}
        - {l1_id: agent.vendor_chat.start_workflow, trigger: "chat assistant tool call", auth_context: "originating SessionContext"}
        - {l1_id: agent.copilot.start_workflow, trigger: "Co-Pilot tool call", auth_context: "originating SessionContext"}
      model_config:
        provider: "ContextualLLMClient -> settings.LLM_PROVIDER (default openai)"
        model: "settings.LLM_DEFAULT_MODEL (default gpt-5-nano)"
        deployment: "environment configured"
        version: unknown
        config_source: "finbot/agents/base.py:41-45; finbot/core/llm/client.py; finbot/config.py:98-107"
        writers: []
        evidence_status: source_confirmed
      instruction_sources:
        - {surface_id: ctx.system_prompts, instruction_role: system, precedence: "system message; recipe text plus BaseAgent control-flow rules and GLOBAL_CONTEXT (user id, date)", config_version: "source revision 1450fc4", writers: []}
      tool_binding_ids: [tb.orchestrator.delegation]
      context_source_ids: [ctx.system_prompts, ctx.workflow_task, ctx.delegated_summaries]
      memory_ids: [mem.workflow_context, mem.agent_events]
      output_sink_ids: [sink.agent_event_bus, sink.guardrail_webhook]
      control_ids: [control.session_context, control.agent_retry, control.iteration_limits, control.guardrail_hooks]
      authority_context:
        principal_source: "originating SessionContext"
        tenant_scope: namespace
        resource_scope: "vendor_id/invoice_id chosen by the LLM for each delegation"
        delegated_identity: "same SessionContext passed to every child agent"
        authz_enforcement: "none of its own; child agents' tools and repositories"
      related_l2_ids: [vendor.onboard_new_vendor, vendor.request_reevaluation, invoice.submit_and_autoprocess, invoice.reprocess_existing, invoice.compliance_document_review, fraud.standalone_compliance_review, chat.trigger_background_workflow]
      visibility: grey_box_required
      reachability: {status: black_box_reachable, notes: "Triggering routes are live; the background run itself was not exercised."}
      source_ref: "finbot/agents/orchestrator.py; finbot/agents/runner.py:197-215"
      evidence_status: source_confirmed
      notes: "Has no data tools and no MCP servers. Max 15 iterations; each delegate_to_* capped at 2 calls per run. Every task_data key is rendered into the user prompt as 'key: value'."

    - id: agent.onboarding
      name: Vendor Onboarding Agent
      component: agent
      agent_kind: specialist
      purpose: Evaluate a vendor profile and set status, trust level, risk level and notes.
      invocation_surfaces:
        - {l1_id: agent.orchestrator.delegate_to_onboarding, trigger: "orchestrator delegation", auth_context: "originating SessionContext"}
      model_config:
        provider: "ContextualLLMClient -> settings.LLM_PROVIDER (default openai)"
        model: "settings.LLM_DEFAULT_MODEL (default gpt-5-nano)"
        deployment: "environment configured"
        version: unknown
        config_source: "finbot/agents/specialized/onboarding.py:39-41; finbot/config.py"
        writers: []
        evidence_status: source_confirmed
      instruction_sources:
        - {surface_id: ctx.system_prompts, instruction_role: system, precedence: "system message; custom_goals slot exists but is always None", config_version: "source revision 1450fc4", writers: []}
      tool_binding_ids: [tb.onboarding.native]
      context_source_ids: [ctx.system_prompts, ctx.workflow_task, ctx.delegated_summaries, ctx.vendor_profile_prompt, ctx.business_tool_results]
      memory_ids: [mem.vendor_data, mem.agent_events]
      output_sink_ids: [sink.agent_notes, sink.delegated_result, sink.agent_event_bus, sink.guardrail_webhook]
      control_ids: [control.session_context, control.agent_retry, control.iteration_limits, control.guardrail_hooks]
      authority_context:
        principal_source: "originating SessionContext"
        tenant_scope: namespace
        resource_scope: "vendor_id from task data (LLM may pass any namespace vendor to tools)"
        delegated_identity: "originating session"
        authz_enforcement: "code: namespace filter in repositories"
      related_l2_ids: [vendor.onboard_new_vendor, vendor.request_reevaluation]
      visibility: grey_box_required
      reachability: {status: black_box_reachable, notes: "Reached via vendor registration or review request; not exercised live."}
      source_ref: "finbot/agents/specialized/onboarding.py"
      evidence_status: source_confirmed
      notes: "User prompt directly includes the vendor's services and agent_notes fields. On completion, task status/summary is written to the current vendor's agent_notes (uses session current_vendor_id, not the task's vendor_id)."

    - id: agent.invoice
      name: Invoice Processing Agent
      component: agent
      agent_kind: specialist
      purpose: Evaluate an invoice (including attached FinDrive files) and approve or reject it.
      invocation_surfaces:
        - {l1_id: agent.orchestrator.delegate_to_invoice, trigger: "orchestrator delegation", auth_context: "originating SessionContext"}
      model_config:
        provider: "ContextualLLMClient -> settings.LLM_PROVIDER (default openai)"
        model: "settings.LLM_DEFAULT_MODEL (default gpt-5-nano)"
        deployment: "environment configured"
        version: unknown
        config_source: "finbot/agents/specialized/invoice.py:43-55; finbot/config.py"
        writers: []
        evidence_status: source_confirmed
      instruction_sources:
        - {surface_id: ctx.system_prompts, instruction_role: system, precedence: "system message; business thresholds from _load_config; custom_goals always None", config_version: "source revision 1450fc4", writers: []}
      tool_binding_ids: [tb.invoice.native, tb.invoice.findrive, tb.invoice.taxcalc]
      context_source_ids: [ctx.system_prompts, ctx.workflow_task, ctx.delegated_summaries, ctx.invoice_prompt, ctx.business_tool_results, ctx.file_content, ctx.mcp_descriptions]
      memory_ids: [mem.invoice_data, mem.vendor_data, mem.file_data, mem.agent_events]
      output_sink_ids: [sink.agent_notes, sink.delegated_result, sink.agent_event_bus, sink.guardrail_webhook]
      control_ids: [control.session_context, control.agent_retry, control.iteration_limits, control.guardrail_hooks, control.mcp_enabled_state]
      authority_context:
        principal_source: "originating SessionContext"
        tenant_scope: namespace
        resource_scope: "invoice_id from task data plus attachment_file_ids; tools accept any namespace invoice/vendor"
        delegated_identity: "originating session"
        authz_enforcement: "code: namespace filter; FinDrive vendor-session rule"
      related_l2_ids: [invoice.submit_and_autoprocess, invoice.reprocess_existing, findrive.store_and_retrieve_document]
      visibility: grey_box_required
      reachability: {status: black_box_reachable, notes: "Reached via invoice create/reprocess; not exercised live."}
      source_ref: "finbot/agents/specialized/invoice.py"
      evidence_status: source_confirmed
      notes: "User prompt directly includes the invoice description and agent_notes. The on-completion notes hook needs invoice_id in the complete_task result, which never carries it, so it does not write; notes are written only through update_invoice_status."

    - id: agent.fraud_compliance
      name: Fraud and Compliance Agent
      component: agent
      agent_kind: specialist
      purpose: Assess vendor/invoice risk and review compliance documents; also runs as the 'System Maintenance Agent' with SystemUtils.
      invocation_surfaces:
        - {l1_id: agent.orchestrator.delegate_to_fraud, trigger: "orchestrator delegation", auth_context: "originating SessionContext"}
        - {l1_id: agent.orchestrator.delegate_to_system_maintenance, trigger: "orchestrator delegation with 'SYSTEM MAINTENANCE REQUEST' prefix", auth_context: "originating SessionContext"}
      model_config:
        provider: "ContextualLLMClient -> settings.LLM_PROVIDER (default openai)"
        model: "settings.LLM_DEFAULT_MODEL (default gpt-5-nano)"
        deployment: "environment configured"
        version: unknown
        config_source: "finbot/agents/specialized/fraud.py:49-67; finbot/config.py"
        writers: []
        evidence_status: source_confirmed
      instruction_sources:
        - {surface_id: ctx.system_prompts, instruction_role: system, precedence: "system message; risk thresholds from _load_config; custom_goals always None", config_version: "source revision 1450fc4", writers: []}
      tool_binding_ids: [tb.fraud.native, tb.fraud.findrive, tb.fraud.finmail, tb.fraud.systemutils]
      context_source_ids: [ctx.system_prompts, ctx.workflow_task, ctx.delegated_summaries, ctx.compliance_docs_prompt, ctx.business_tool_results, ctx.file_content, ctx.email_content, ctx.mcp_descriptions]
      memory_ids: [mem.vendor_data, mem.invoice_data, mem.file_data, mem.email_data, mem.agent_events]
      output_sink_ids: [sink.agent_notes, sink.delegated_result, sink.finmail_inbox, sink.finmail_dead_drop, sink.agent_event_bus, sink.guardrail_webhook]
      control_ids: [control.session_context, control.agent_retry, control.iteration_limits, control.guardrail_hooks, control.mcp_enabled_state]
      authority_context:
        principal_source: "originating SessionContext"
        tenant_scope: namespace
        resource_scope: "vendor_id from task data; tools accept any namespace vendor/invoice"
        delegated_identity: "originating session"
        authz_enforcement: "code: namespace filter; FinDrive/FinMail vendor-session rules"
      related_l2_ids: [vendor.onboard_new_vendor, vendor.request_reevaluation, invoice.submit_and_autoprocess, invoice.reprocess_existing, invoice.compliance_document_review, fraud.standalone_compliance_review, chat.trigger_background_workflow]
      visibility: grey_box_required
      reachability: {status: black_box_reachable, notes: "Reached via onboarding/invoice workflows and chat-started reviews; not exercised live."}
      source_ref: "finbot/agents/specialized/fraud.py; finbot/agents/orchestrator.py:540-572"
      evidence_status: source_confirmed
      notes: "When the task description contains document-review keywords, up to two FinDrive /documents files are read directly from the repository and pasted into the user prompt. On completion, notes go to the current vendor's fraud agent notes (falls back to session current_vendor_id; skipped in admin sessions)."

    - id: agent.payments
      name: Payments Agent
      component: agent
      agent_kind: specialist
      purpose: Pay approved invoices (marks the invoice paid) and create FinStripe transfers.
      invocation_surfaces:
        - {l1_id: agent.orchestrator.delegate_to_payments, trigger: "orchestrator delegation", auth_context: "originating SessionContext"}
      model_config:
        provider: "ContextualLLMClient -> settings.LLM_PROVIDER (default openai)"
        model: "settings.LLM_DEFAULT_MODEL (default gpt-5-nano)"
        deployment: "environment configured"
        version: unknown
        config_source: "finbot/agents/specialized/payments.py:46-59; finbot/config.py"
        writers: []
        evidence_status: source_confirmed
      instruction_sources:
        - {surface_id: ctx.system_prompts, instruction_role: system, precedence: "system message; custom_goals always None", config_version: "source revision 1450fc4", writers: []}
      tool_binding_ids: [tb.payments.native, tb.payments.finstripe, tb.payments.taxcalc]
      context_source_ids: [ctx.system_prompts, ctx.workflow_task, ctx.delegated_summaries, ctx.business_tool_results, ctx.mcp_descriptions]
      memory_ids: [mem.invoice_data, mem.vendor_data, mem.payment_data, mem.agent_events]
      output_sink_ids: [sink.payment_records, sink.delegated_result, sink.agent_event_bus, sink.guardrail_webhook]
      control_ids: [control.session_context, control.agent_retry, control.iteration_limits, control.guardrail_hooks, control.mcp_enabled_state, control.payment_status_check]
      authority_context:
        principal_source: "originating SessionContext"
        tenant_scope: namespace
        resource_scope: "invoice_id from task data; FinStripe create_transfer accepts any vendor_account/amount/vendor_id/invoice_id"
        delegated_identity: "originating session"
        authz_enforcement: "code: namespace filter; process_payment requires status 'approved'; FinStripe checks only amount > 0"
      related_l2_ids: [invoice.submit_and_autoprocess, invoice.reprocess_existing, payment.execute_transfer]
      visibility: grey_box_required
      reachability: {status: black_box_reachable, notes: "Reached after invoice approval in the invoice workflows; not exercised live."}
      source_ref: "finbot/agents/specialized/payments.py; finbot/tools/data/payment.py:47-100"
      evidence_status: source_confirmed
      notes: "The on-completion notes hook needs invoice_id in the complete_task result, which never carries it, so it does not write. The orchestrator appends a 'next_step' instruction to the payments result."

    - id: agent.communication
      name: Communication Agent
      component: agent
      agent_kind: specialist
      purpose: Compose notifications and send them through FinMail.
      invocation_surfaces:
        - {l1_id: agent.orchestrator.delegate_to_communication, trigger: "orchestrator delegation (final step of every recipe)", auth_context: "originating SessionContext"}
      model_config:
        provider: "ContextualLLMClient -> settings.LLM_PROVIDER (default openai)"
        model: "settings.LLM_DEFAULT_MODEL (default gpt-5-nano)"
        deployment: "environment configured"
        version: unknown
        config_source: "finbot/agents/specialized/communication.py:47-60; finbot/config.py"
        writers: []
        evidence_status: source_confirmed
      instruction_sources:
        - {surface_id: ctx.system_prompts, instruction_role: system, precedence: "system message; includes namespace admin and department addresses", config_version: "source revision 1450fc4", writers: []}
      tool_binding_ids: [tb.communication.native, tb.communication.finmail]
      context_source_ids: [ctx.system_prompts, ctx.workflow_task, ctx.delegated_summaries, ctx.business_tool_results, ctx.email_content, ctx.mcp_descriptions]
      memory_ids: [mem.email_data, mem.vendor_data, mem.invoice_data, mem.agent_events]
      output_sink_ids: [sink.finmail_inbox, sink.finmail_dead_drop, sink.delegated_result, sink.agent_event_bus, sink.guardrail_webhook]
      control_ids: [control.session_context, control.agent_retry, control.iteration_limits, control.guardrail_hooks, control.mcp_enabled_state]
      authority_context:
        principal_source: "originating SessionContext"
        tenant_scope: namespace
        resource_scope: "vendor_id plus optional to/cc/bcc addresses from task data; send_email accepts any address"
        delegated_identity: "originating session; sender is the vendor email in vendor sessions, admin address otherwise"
        authz_enforcement: "code: FinMail routing decides inbox; no recipient allowlist"
      related_l2_ids: [communication.agent_initiated_notification, vendor.onboard_new_vendor, vendor.request_reevaluation, invoice.submit_and_autoprocess, invoice.reprocess_existing, invoice.compliance_document_review, fraud.standalone_compliance_review]
      visibility: grey_box_required
      reachability: {status: black_box_reachable, notes: "Final step of every workflow recipe; not exercised live."}
      source_ref: "finbot/agents/specialized/communication.py"
      evidence_status: source_confirmed
      notes: "On completion only logs; writes nothing."

  tool_bindings:
    - id: tb.vendor.native
      agent_id: agent.vendor_chat
      l1_ids: [agent.vendor_chat.get_vendor_details, agent.vendor_chat.get_invoice_details, agent.vendor_chat.get_vendor_invoices, agent.vendor_chat.get_vendor_payment_summary, agent.vendor_chat.get_vendor_contact_info, agent.vendor_chat.start_workflow]
      tool_name: "vendor chat native functions"
      tool_source: code
      server_or_provider: "finbot/tools/data/*"
      schema_ref: "finbot/agents/chat.py:571-693"
      description_source: {source_ref: "finbot/agents/chat.py:571-693", writers: []}
      capabilities: ["get_vendor_details(vendor_id)", "get_invoice_details(invoice_id)", "get_vendor_invoices(vendor_id)", "get_vendor_payment_summary(vendor_id)", "get_vendor_contact_info(vendor_id)", "start_workflow(description, vendor_id, invoice_id, attachment_file_ids)"]
      execution_identity: {identity: "originating SessionContext", credential_source: "none (direct DB access)"}
      argument_handling: {validation: "strict JSON schema in tool definition", authorization: "namespace filter only; no current_vendor_id check", normalization: "json.dumps of result", enforced_by: code}
      output_ids: [ctx.business_tool_results, ctx.workflow_task]
      effect_class: mixed
      approval_required: false
      related_l2_ids: [chat.vendor_assistant_conversation, chat.trigger_background_workflow]
      visibility: white_box_required
      reachability: {status: black_box_reachable, notes: "Invoked by chatting; not exercised live."}
      evidence_status: source_confirmed
      source_ref: "finbot/agents/chat.py:695-723"
      notes: "Reads are side-effect free; start_workflow launches a background orchestrator run."

    - id: tb.copilot.native
      agent_id: agent.finance_copilot
      l1_ids: [agent.copilot.list_vendors, agent.vendor_chat.get_vendor_details, agent.vendor_chat.get_invoice_details, agent.vendor_chat.get_vendor_invoices, agent.vendor_chat.get_vendor_payment_summary, agent.vendor_chat.get_vendor_contact_info, agent.copilot.get_all_vendors_summary, agent.copilot.get_pending_actions_summary, agent.copilot.get_vendor_compliance_docs, agent.copilot.get_vendor_activity_report, agent.copilot.save_report, agent.copilot.start_workflow]
      tool_name: "Co-Pilot native functions"
      tool_source: code
      server_or_provider: "finbot/tools/data/*; finbot/tools/data/admin_reports.py"
