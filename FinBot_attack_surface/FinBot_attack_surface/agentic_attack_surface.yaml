  controls:
    - id: control.session_context
      control_kind: authorization
      applies_at: other
      enforcement_mode: blocking
      implementation: code
      failure_mode: fail_closed
      applies_to_agent_ids: [agent.vendor_chat, agent.finance_copilot, agent.orchestrator, agent.onboarding, agent.invoice, agent.fraud_compliance, agent.payments, agent.communication]
      related_l1_ids: [root.api.session_status, root.auth.magic_link_verify, vendor.api.vendors.switch]
      related_l2_ids: [auth.bind_session_to_email, vendor.switch_active_context]
      evidence_status: observed
      source_ref: "finbot/core/auth/middleware.py; finbot/core/data/repositories.py:30-45"
      visibility: grey_box_required
      reachability: {status: black_box_reachable, notes: "Live session status shows a per-user namespace."}
      notes: "Enforces namespace isolation only. Within a namespace, agent tools do not check current_vendor_id, and the admin portal has no role check."

    - id: control.csrf
      control_kind: input_filter
      applies_at: other
      enforcement_mode: blocking
      implementation: code
      failure_mode: fail_closed
      applies_to_agent_ids: [agent.vendor_chat, agent.finance_copilot, agent.orchestrator]
      related_l1_ids: [vendor.api.chat.send, admin.api.copilot.chat, vendor.api.vendors.register, vendor.api.invoices.create, admin.api.mcp.update_server_config, darklab.api.supply_chain.update_tool_overrides]
      related_l2_ids: [chat.vendor_assistant_conversation, chat.copilot_conversation_and_reporting, vendor.onboard_new_vendor, mcp_supply_chain.override_tool_description]
      evidence_status: observed
      source_ref: "finbot/core/auth/csrf.py; finbot/config.py:74"
      visibility: black_box_observable
      reachability: {status: black_box_reachable, notes: "POST /vendor/api/v1/chat without X-CSRF-Token returned 403 live."}
      notes: "Protects the HTTP entry points only; nothing inside the agent runtime."

    - id: control.guardrail_hooks
      control_kind: webhook
      applies_at: before_tool
      enforcement_mode: observe_only
      implementation: external_service
      failure_mode: bypass
      applies_to_agent_ids: [agent.vendor_chat, agent.finance_copilot, agent.orchestrator, agent.onboarding, agent.invoice, agent.fraud_compliance, agent.payments, agent.communication]
      related_l1_ids: [labs.api.guardrails.upsert_config, labs.api.guardrails.toggle_enabled, labs.api.guardrails.test_webhook, labs.api.guardrails.get_activity]
      related_l2_ids: [guardrail.configure_webhook, guardrail.passive_hook_firing, guardrail.test_webhook_delivery]
      evidence_status: observed
      source_ref: "finbot/guardrails/service.py; finbot/agents/base.py:152-189; finbot/agents/chat.py:174-200,364-394"
      visibility: grey_box_required
      reachability: {status: conditionally_mounted, notes: "Inactive until a webhook is configured; GET /labs/api/v1/guardrails returned null live."}
      notes: "Chat assistants fire before/after_model and before/after_tool; BaseAgent agents fire before/after_tool only. Verdicts (allow/block) are logged and never enforced."

    - id: control.agent_retry
      control_kind: other
      applies_at: delegation
      enforcement_mode: modifying
      implementation: code
      failure_mode: retry
      applies_to_agent_ids: [agent.orchestrator, agent.onboarding, agent.invoice, agent.fraud_compliance, agent.payments, agent.communication]
      related_l1_ids: [vendor.api.vendors.register, vendor.api.invoices.create, agent.orchestrator.delegate_to_invoice]
      related_l2_ids: [vendor.onboard_new_vendor, invoice.submit_and_autoprocess]
      evidence_status: source_confirmed
      source_ref: "finbot/agents/runner.py:21-110"
      visibility: white_box_required
      reachability: {status: black_box_reachable, notes: "Wraps every background agent run."}
      notes: "Up to 3 attempts with 1s/2s back-off, only for exceptions escaping process(). The agent loop converts most errors to a 'failed' complete_task, so retries are uncommon. A retried orchestrator starts with empty workflow context."

    - id: control.iteration_limits
      control_kind: rate_limit
      applies_at: other
      enforcement_mode: blocking
      implementation: code
      failure_mode: abort
      applies_to_agent_ids: [agent.vendor_chat, agent.finance_copilot, agent.orchestrator, agent.onboarding, agent.invoice, agent.fraud_compliance, agent.payments, agent.communication]
      related_l1_ids: [agent.orchestrator.complete_task]
      related_l2_ids: [chat.vendor_assistant_conversation, invoice.submit_and_autoprocess]
      evidence_status: source_confirmed
      source_ref: "finbot/agents/base.py:100-306,399-408; finbot/agents/orchestrator.py:24,48-49,381-401; finbot/agents/chat.py:349"
      visibility: white_box_required
      reachability: {status: black_box_reachable, notes: "Always active."}
      notes: "Specialists: AGENT_MAX_ITERATIONS (10), force-fail after 2 text-only turns. Orchestrator: 15 iterations; each delegate_to_* capped at 2 calls. Chat: 15 model/tool rounds per message."

    - id: control.mcp_enabled_state
      control_kind: tool_policy
      applies_at: before_model
      enforcement_mode: blocking
      implementation: platform_config
      failure_mode: fail_open
      applies_to_agent_ids: [agent.vendor_chat, agent.finance_copilot, agent.invoice, agent.fraud_compliance, agent.payments, agent.communication]
      related_l1_ids: [admin.api.mcp.toggle_server, admin.api.mcp.update_server_config]
      related_l2_ids: [mcp_server.manage_operational_config]
      evidence_status: observed
