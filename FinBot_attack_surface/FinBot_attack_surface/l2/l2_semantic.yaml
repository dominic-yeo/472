  - id: mcp_server.manage_operational_config
    semantic_operation: "Enable/disable an MCP server, or tune its plain operational parameters, for the caller's own namespace"
    business_objects: [MCPServerConfig, AgentSession]
    realizing_l1_ids: [admin.api.mcp.update_server_config, admin.api.mcp.toggle_server]
    parameter_flow:
      - from: {component: admin, l1_id: "admin.api.mcp.update_server_config", parameter: "body.config (ServerConfigUpdate{config: dict}, e.g. {max_payment: ...} for finstripe or {max_file_size_kb: ...} for findrive)"}
        to: {component: admin, l1_id: null, parameter: "MCPServerConfig.config_json"}
        transformation: "JSON-serialized and written verbatim (overwriting the prior value, not merged at write time) via MCPServerConfigRepository.update_config (repositories.py:642-651), keyed to (namespace, server_type) from the path param"
      - from: {component: admin, l1_id: null, parameter: "MCPServerConfig.config_json"}
        to: {component: agent, l1_id: null, parameter: "create_mcp_server() server_config dict"}
        transformation: "at the next create_mcp_server() call, db_config.get_config() (factory.py:83,97) JSON-decodes the stored dict and passes it as server_config to the per-type factory function"
      - from: {component: agent, l1_id: null, parameter: "server_config dict"}
        to: {component: agent, l1_id: "mcp.finstripe.create_transfer | mcp.findrive.upload_file", parameter: "runtime config = {**DEFAULT_CONFIG, **(server_config or {})}"}
        transformation: "each factory function (e.g. finbot/mcp/servers/finstripe/server.py:43, finbot/mcp/servers/findrive/server.py:41) merges the stored config over that server's own DEFAULT_CONFIG; confirmed enforced example: findrive.max_file_size_kb gates upload_file's content-size check (findrive/server.py:58-60, 'File exceeds maximum size of {max_file_size_kb}KB'); finstripe.max_payment is present in FinStripe's DEFAULT_CONFIG/merged runtime config the same way but is not read by create_transfer's own validation logic (only 'amount <= 0' is checked) — included here as the record's own named example of a config key, not as a claim that it is enforced"
      - from: {component: admin, l1_id: "admin.api.mcp.toggle_server", parameter: "path.server_type (sole input; no request body — toggle_enabled flips the existing boolean)"}
        to: {component: admin, l1_id: null, parameter: "MCPServerConfig.enabled"}
        transformation: "MCPServerConfigRepository.toggle_enabled (repositories.py:664-671) sets enabled = not enabled for the row matching (namespace, server_type)"
      - from: {component: admin, l1_id: null, parameter: "MCPServerConfig.enabled = False"}
        to: {component: agent, l1_id: null, parameter: "create_mcp_server() return value"}
        transformation: "at the next create_mcp_server() call for that (server_type, namespace), the `if not db_config.enabled: return None` check (factory.py:88-95) fires before the factory function or tool-override logic ever runs — the agent that requested this server simply does not get it in its MCP server set, with no error surfaced; note this reads/writes the SAME MCPServerConfig row that mcp_supply_chain.override_tool_description acts on, but a different JSON column (config_json / enabled here vs tool_overrides_json there) via a different app (admin vs darklab) — see that record's factory.py trace for the tool_overrides_json path, not re-derived here"
    preconditions: ["CSRF header"]
    effect_state_transition: >
      config_json merged over that server's DEFAULT_CONFIG (e.g. finstripe.max_payment,
      findrive.max_file_size_kb, taxcalc.tax_rates, systemutils.mock_hostname,
      finmail.max_results_per_query); toggling enabled=false makes
      create_mcp_server() refuse to instantiate that server for ANY agent in the
      namespace on their next run (returns None — the agent simply loses that tool set
      silently rather than erroring).
    observable_evidence: ["Config values reflected on GET admin.api.mcp.get_server; a disabled server's tools disappear from the next chat/workflow run's tool list"]
    visibility: black_box_observable
    reachability: {status: black_box_reachable, notes: ""}
    source_ref: "finbot/apps/admin/routes/api.py:157-190"
    notes: "Operates on the SAME MCPServerConfig row as mcp_supply_chain.override_tool_description, via a different JSON column (config_json vs tool_overrides_json) and a different app (admin vs darklab)."

  # =========================================================================
  # Guardrail webhook (finbot/apps/labs)
  # =========================================================================

  - id: guardrail.configure_webhook
    semantic_operation: "Register an outbound webhook to be notified around the caller's own agent model/tool calls"
    business_objects: [GuardrailConfig]
    realizing_l1_ids: [labs.api.guardrails.upsert_config, labs.api.guardrails.toggle_enabled, labs.api.guardrails.rotate_secret]
    parameter_flow:
      - from: {component: labs, l1_id: "labs.api.guardrails.upsert_config", parameter: "body.webhook_url"}
        to: {component: labs, l1_id: null, parameter: "validate_webhook_url(url) [repositories.py:1297-1345]"}
        transformation: "SSRF-hardening check: scheme must be http/https; hostname must not be 'metadata.google.internal'; outside DEBUG, 'localhost' and RFC1918/loopback/link-local IPs (_BLOCKED_NETWORKS) are rejected, and any non-80/443 port must fall in 1024-65535 — else ValueError -> 422"
      - from: {component: labs, l1_id: "labs.api.guardrails.upsert_config", parameter: "body.webhook_url (post-validation)"}
        to: {component: labs, l1_id: null, parameter: "LabsGuardrailConfig.webhook_url"}
        transformation: "written verbatim by LabsGuardrailConfigRepository.upsert (repositories.py:1376-1424), scoped to (namespace, user_id)"
      - from: {component: labs, l1_id: "labs.api.guardrails.upsert_config", parameter: "body.hooks"}
        to: {component: labs, l1_id: null, parameter: "LabsGuardrailConfig.hooks_json"}
        transformation: "keys validated against VALID_HOOK_KINDS={before_model,after_model,before_tool,after_tool} (unknown key -> ValueError/422); json.dumps'd verbatim; if omitted, defaults to all four kinds = True"
      - from: {component: labs, l1_id: "labs.api.guardrails.upsert_config", parameter: "body.timeout_seconds, body.enabled"}
        to: {component: labs, l1_id: null, parameter: "LabsGuardrailConfig.timeout_seconds, LabsGuardrailConfig.enabled"}
        transformation: "timeout_seconds clamped to [1,30] via max(1,min(x,30)); enabled written verbatim"
      - from: {component: labs, l1_id: null, parameter: "secrets.token_urlsafe(32) [repositories.py:1411, first-save-only]"}
        to: {component: labs, l1_id: null, parameter: "LabsGuardrailConfig.signing_secret"}
        transformation: "server-generated, only minted on the FIRST insert for this (namespace,user_id) — a subsequent PUT to an existing config leaves signing_secret untouched; POST /rotate-secret (labs.api.guardrails.rotate_secret) regenerates it the same way"
      - from: {component: labs, l1_id: null, parameter: "LabsGuardrailConfig.signing_secret"}
        to: {component: labs, l1_id: "labs.api.guardrails.upsert_config", parameter: "response.signing_secret"}
        transformation: "read back and echoed in the PUT/GET/toggle/rotate response bodies (config.to_dict() + signing_secret injected, guardrails.py:55-56,78-79,95-96,112-113); this is the value later used to HMAC-sign every outbound hook POST — see guardrail.passive_hook_firing hop 2"
      - from: {component: labs, l1_id: "labs.api.guardrails.toggle_enabled", parameter: "(no body — toggles existing row)"}
        to: {component: labs, l1_id: null, parameter: "LabsGuardrailConfig.enabled"}
        transformation: "flipped via `not config.enabled`; 404 if no config row exists yet for this (namespace,user_id)"
    preconditions: ["CSRF header", "webhook_url must pass the SSRF-hardening validator (blocks localhost/metadata/RFC1918 outside DEBUG)"]
    effect_state_transition: "LabsGuardrailConfig row upserted for (namespace, user_id); first save mints a signing_secret used to HMAC-sign every subsequent hook POST."
    observable_evidence: ["GET labs.api.guardrails.get_config reflects saved state"]
    visibility: black_box_observable
    reachability: {status: black_box_reachable, notes: ""}
    source_ref: "finbot/core/data/repositories.py:1297-1394"
    notes: ""

  - id: guardrail.passive_hook_firing
    semantic_operation: "The platform notifies a configured webhook before/after every model call and before/after every tool call the caller's agents make, without ever acting on the webhook's response"
    business_objects: [GuardrailConfig, AgentSession]
    realizing_l1_ids: [labs.api.guardrails.get_activity]
    parameter_flow:
      - from: {component: agent, l1_id: null, parameter: "tool_call_name, tool_call['arguments'] (base.py:145-157) OR name, arguments (chat.py:171-179) OR resolved_model, user_message_info['user_message'] (contextual_client.py:153-157) OR response.content (contextual_client.py:167-172)"}
        to: {component: labs, l1_id: null, parameter: "GuardrailHookService.invoke(kind, tool_name=..., tool_arguments=..., model=..., user_message=..., model_output=...)"}
        transformation: "real agent/tool/LLM activity forwarded unchanged into the hook call; before_tool/after_tool carry tool_name+tool_source+tool_arguments(+tool_result on after_tool); before_model/after_model carry model+user_message(+model_output on after_model) — gated by _is_hook_enabled(kind) reading LabsGuardrailConfig.enabled and hooks_json for this hook kind (service.py:66-71); if disabled/no config, invoke short-circuits and nothing is sent"
      - from: {component: labs, l1_id: null, parameter: "HookEnvelope{hook_kind, session_id, workflow_id, tool_name, tool_source, tool_arguments, tool_result, model, user_message, model_output, timestamp}"}
        to: {component: labs, l1_id: null, parameter: "body_bytes (envelope.model_dump_json().encode(), truncated to settings.LABS_GUARDRAIL_MAX_PAYLOAD_BYTES)"}
        transformation: "serialized to JSON; HMAC-SHA256 signature computed over f'{timestamp}.'+body using LabsGuardrailConfig.signing_secret (the value minted in guardrail.configure_webhook) via _sign_payload (service.py:73-77,132)"
      - from: {component: labs, l1_id: null, parameter: "body_bytes, X-Guardrail-Signature, X-Guardrail-Timestamp"}
        to: {component: vendor, l1_id: null, parameter: "POST <LabsGuardrailConfig.webhook_url> (user-registered, attacker-controlled endpoint)"}
        transformation: "httpx.AsyncClient POST with timeout=config.timeout_seconds (service.py:148-154); component modeled as 'vendor' in the sense of an external/user-supplied HTTP sink, not an L1-cataloged interaction"
      - from: {component: vendor, l1_id: null, parameter: "response body (expected shape: WebhookVerdict{verdict: allow|block, reason})"}
        to: {component: labs, l1_id: null, parameter: "parsed.verdict, parsed.reason (verdict_str, reason) OR outcome=invalid_verdict/error/timeout on failure"}
        transformation: "parsed via WebhookVerdict.model_validate_json on HTTP 200; any other status -> HookOutcome.error, non-conforming JSON -> HookOutcome.invalid_verdict, no response within timeout -> HookOutcome.timeout"
      - from: {component: labs, l1_id: null, parameter: "verdict_str (parsed webhook verdict, e.g. 'block')"}
        to: {component: agent, l1_id: null, parameter: "(none — verdict is returned from invoke() as HookOutcome only; the calling agent/tool-execution code path in base.py:152-189, chat.py:171-202,364-394 and contextual_client.py:153-172 never inspects or branches on it)"}
        transformation: "EXPLICITLY DISCARDED: invoke() docstring states callers must NOT branch on the outcome — tool execution, model calls, and the agent loop all proceed unconditionally regardless of an 'allow' or 'block' verdict; the verdict has zero effect on control flow, this is the central property of the record"
      - from: {component: labs, l1_id: null, parameter: "kind, outcome, verdict_str, reason, latency_ms, http_status, error_detail, tool_name, tool_source, tool_arguments, model"}
        to: {component: labs, l1_id: null, parameter: "event_data (dict) passed to event_bus.emit_agent_event(agent_name='guardrail', event_type=f'webhook_{outcome.value}', ...) [service.py:204-262]"}
        transformation: "only outcome/verdict/reason/latency/tool_name/model metadata is persisted to the event store for later display — tool_result and model_output/user_message full bodies are NOT included in event_data, only tool_arguments/tool_name/model are"
      - from: {component: labs, l1_id: null, parameter: "CTFEvent row (agent_name='guardrail')"}
        to: {component: labs, l1_id: "labs.api.guardrails.get_activity", parameter: "response[] (ev.to_dict() per event)"}
        transformation: "read back via CTFEventRepository.get_events(category='agent'), filtered client-side to agent_name=='guardrail' (guardrails.py:151-165); this is the only place the verdict becomes observable, purely as a log entry, never as an enforcement decision"
    preconditions: ["config saved, enabled=true, and the specific hook_kind (before_model/after_model/before_tool/after_tool) toggled on"]
    effect_state_transition: >
      For every matching point in the agent loop (finbot/agents/base.py:152-189,
      finbot/agents/chat.py:174-200,364-394, finbot/core/llm/contextual_client.py),
      an HMAC-signed HTTP POST is sent to the registered webhook carrying tool
      name/arguments/result or model input/output. THE RETURNED "allow"/"block" VERDICT
      IS NEVER ACTED ON — this is explicit by design (finbot/guardrails/service.py:1-6,
      91-95): "Never gates execution on the verdict... callers must NOT branch on the
      outcome." Execution always proceeds regardless of what the webhook returns or
      whether it responds at all.
    observable_evidence: ["guardrail agent events (agent_name='guardrail') visible via labs.api.guardrails.get_activity, carrying outcome/verdict/latency/tool_name"]
    visibility: white_box_required
    reachability: {status: black_box_reachable, notes: "fires automatically on real agent activity once configured — no separate trigger needed"}
    source_ref: "finbot/guardrails/service.py:1-6,79-202"
    notes: >
      Functionally this is an observability/notification feature, not an enforcement
      control, despite exposing an allow/block verdict schema — worth documenting
      explicitly since the schema's presence could otherwise be mistaken for a real gate.

  - id: guardrail.test_webhook_delivery
    semantic_operation: "Send a synthetic hook payload to the configured webhook to verify connectivity/signature handling"
    business_objects: [GuardrailConfig]
    realizing_l1_ids: [labs.api.guardrails.test_webhook]
    parameter_flow:
      - from: {component: labs, l1_id: "labs.api.guardrails.test_webhook", parameter: "(trigger only — no request body)"}
        to: {component: labs, l1_id: null, parameter: "GuardrailHookService(session_context, workflow_id='wf_labs_test').invoke(HookKind.before_tool, tool_name='test_tool', tool_source='native', tool_arguments={'example_param':'hello_from_labs'})"}
        transformation: "synthetic fixed values constructed server-side (guardrails.py:131-144), not derived from any real agent activity; workflow_id is a hardcoded literal, not a live workflow"
      - from: {component: labs, l1_id: null, parameter: "signing_secret, webhook_url (from the caller's LabsGuardrailConfig, as configured in guardrail.configure_webhook)"}
        to: {component: vendor, l1_id: null, parameter: "POST <webhook_url> with X-Guardrail-Signature/X-Guardrail-Timestamp, one-off HMAC-signed synthetic envelope"}
        transformation: "same invoke() path as guardrail.passive_hook_firing (service.py:79-202): envelope built, signed, POSTed with config.timeout_seconds deadline"
      - from: {component: vendor, l1_id: null, parameter: "webhook response ({verdict, reason} or error/timeout)"}
        to: {component: labs, l1_id: "labs.api.guardrails.test_webhook", parameter: "response.outcome, response.message"}
        transformation: "outcome.value returned directly as {'outcome': outcome.value, 'message': f'Hook fired with outcome: {outcome.value}'} (guardrails.py:145-148); verdict itself is not surfaced in this response, only the HookOutcome classification"
      - from: {component: labs, l1_id: null, parameter: "same invoke() call as above"}
        to: {component: labs, l1_id: "labs.api.guardrails.get_activity", parameter: "one new CTFEvent(agent_name='guardrail', event_type=f'webhook_{outcome.value}')"}
        transformation: "logged exactly as any other hook firing would be, indistinguishable in the activity feed from a real before_tool event except for tool_name='test_tool' and workflow_id='wf_labs_test'; not persisted as chat/tool history"
    preconditions: ["config saved and enabled, before_tool hook toggled on — else short-circuits with no network call"]
    effect_state_transition: "One-off HMAC-signed POST with synthetic tool_name='test_tool' and fixed workflow_id='wf_labs_test'; not persisted as chat/tool history, only the resulting guardrail event is logged."
    observable_evidence: ["Response body {outcome, message}; one new guardrail activity entry"]
    visibility: black_box_observable
    reachability: {status: black_box_reachable, notes: ""}
    source_ref: "finbot/apps/labs/routes/guardrails.py:131-148"
    notes: ""

  # =========================================================================
  # Auth / session
  # =========================================================================

  - id: auth.bind_session_to_email
    semantic_operation: "Upgrade an anonymous temporary session to a persistent, email-bound session via a magic link"
    business_objects: [User, AgentSession]
    realizing_l1_ids: [root.auth.magic_link_request, root.auth.magic_link_verify]
    parameter_flow:
      - from: {component: root, l1_id: "root.auth.magic_link_request", parameter: "email (Form body param)"}
        to: {component: root, l1_id: null, parameter: "MagicLinkToken.email"}
        transformation: "lowercased+stripped (auth.py:36), stored on a new MagicLinkToken row along with a fresh secrets.token_urlsafe(32) token and expires_at=now+MAGIC_LINK_EXPIRY_MINUTES; MagicLinkToken.session_id bound to the CURRENT session_context.session_id if one exists (anonymous/temporary session)"
      - from: {component: root, l1_id: null, parameter: "MagicLinkToken.token"}
        to: {component: root, l1_id: null, parameter: "magic_link URL = f'{MAGIC_LINK_BASE_URL}/auth/verify?token={token}'"}
        transformation: "embedded in the emailed link via email_service.send_magic_link(email, magic_link) (auth.py:58-63); single-use token now the sole credential for the verify step"
      - from: {component: root, l1_id: null, parameter: "magic_link_url (delivered out-of-band via email)"}
        to: {component: root, l1_id: "root.auth.magic_link_verify", parameter: "token (query param)"}
        transformation: "whoever clicks the link supplies token back verbatim; looked up against MagicLinkToken.token, validated not-used/not-expired via is_valid(), then marked used_at=now (auth.py:93-119) — single use enforced here"
      - from: {component: root, l1_id: "root.auth.magic_link_verify", parameter: "magic_token.email, session_id_to_upgrade (current browser's session_id, else magic_token.session_id from hop 1)"}
        to: {component: root, l1_id: null, parameter: "SessionManager.upgrade_to_permanent(session_id, email) [session.py:633-767]"}
        transformation: "email re-lowercased+stripped; branches on whether a User with this email already exists"
      - from: {component: root, l1_id: null, parameter: "upgrade_to_permanent — branch (a): no existing User for this email"}
        to: {component: root, l1_id: "root.auth.magic_link_verify", parameter: "updated_context (same session_id, is_temporary=False, email bound)"}
        transformation: "CURRENT temp session upgraded IN PLACE (session.py:703-759): UserSession.email/is_temporary/expires_at updated, session_data JSON re-signed via _sign_session_data, a new User row created via db.merge — any state accumulated on the anonymous session (current_vendor_id, prior chat/workflow context tied to this session_id) survives because the session row and its id are unchanged"
      - from: {component: root, l1_id: null, parameter: "upgrade_to_permanent — branch (b): existing_user found for this email"}
        to: {component: root, l1_id: "root.auth.magic_link_verify", parameter: "new_session (DIFFERENT session_id, freshly created via create_session)"}
        transformation: "current_session row is db.delete()'d and committed (session.py:677-701) BEFORE a brand-new session is minted for the existing user — the original temp session_id is destroyed, so any anonymous-session-scoped state (e.g. current_vendor_id, in-flight agent workflow context keyed to the old session_id) is discarded, not merged; caller receives (new_session, is_existing_user=True)"
      - from: {component: root, l1_id: "root.auth.magic_link_verify", parameter: "new_session.session_id (from whichever branch fired)"}
        to: {component: root, l1_id: null, parameter: "Set-Cookie: <SESSION_COOKIE_NAME>=<session_id>; max_age=PERM_SESSION_TIMEOUT"}
        transformation: "written to the redirect response (auth.py:174-184) and redirected to /portals; this cookie is the client's only signal of which branch fired — same session_id as before verify (branch a) vs. a new one (branch b)"
    preconditions: ["possession of the emailed link's single-use token, unexpired"]
    effect_state_transition: >
      SessionManager.upgrade_to_permanent (finbot/core/auth/session.py:633-767): if the
      email is new, the CURRENT session is upgraded in place (is_temporary=False,
      email bound, PERM_SESSION_TIMEOUT applied); if the email already has an account,
      the temp session is discarded and a fresh session for the existing user is created
      instead (temp-session progress, e.g. any vendors registered anonymously, is lost in
      that case).
    observable_evidence: ["GET root.api.session_status (if present) shows is_temporary=false and the bound email/namespace afterward"]
    visibility: black_box_observable
    reachability: {status: black_box_reachable, notes: ""}
    source_ref: "finbot/core/auth/session.py:633-767; finbot/apps/finbot/auth.py:84-198"
    notes: "This is the ONLY state transition point from session:temporary to session:persistent in the entire platform."
