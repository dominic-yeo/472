# L1 — vendor sub-app (finbot/apps/vendor/**, mounted at /vendor)
# Schema: FinBot_attack_surface/schema/L1_schema.yaml
# component = "vendor" for all records. Live-confirmed via /vendor/openapi.json (33 paths, 2026-09-19).
#
# Cross-cutting facts for this whole file:
#   - ALL 33 routes depend on get_session_context (finbot/core/auth/middleware.py:156-161) —
#     a bare anonymous/temporary session is sufficient. None use
#     get_authenticated_session_context. auth_requirement is therefore
#     "session:temporary" for every record unless noted.
#   - authz_check_location "repository_layer" = NamespacedRepository filters by
#     session_context.namespace only (finbot/core/data/repositories.py:30-45).
#     "in_handler" = the route additionally compares the fetched row's vendor_id/id
#     to session_context.current_vendor_id and 403s on mismatch (stronger).
#   - current_vendor_id is loaded onto the session only for /vendor-prefixed requests
#     (finbot/core/auth/middleware.py:38-41,99-109), auto-selecting the namespace's
#     first vendor if none was chosen yet (finbot/core/auth/session.py:859-868).
#   - CSRF header required on every POST/PUT/DELETE (no /vendor/ exemption in
#     finbot/core/auth/csrf.py:29-38); frontend auto-attaches it via
#     finbot/static/js/common/api.js:48-54 reading <meta name="csrf-token">.

