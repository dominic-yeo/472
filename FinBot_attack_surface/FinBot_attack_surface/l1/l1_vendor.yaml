    auth_requirement: session:temporary
    authz_check_location: none
    state_preconditions: ["CSRF header required"]
    reachability: {status: black_box_reachable, notes: ""}
    visibility: black_box_observable
    controls_observed: {csrf: true, rate_limited: false, security_headers: true}
    evidence: {source_ref: "finbot/apps/vendor/routes/api.py:89-151"}
    notes: >
      Creates a Vendor row scoped to session_context.namespace (VendorRepository.create_vendor,
      repositories.py:282-318). Full bank details (account number, routing number, holder
      name, TIN) accepted with only Pydantic type validation, no format/ownership check.
      On success schedules a BackgroundTasks call to run_orchestrator_agent (agent_tool_call
      realizing vendor.onboarding.evaluate — see l1_mcp.yaml / l2_semantic.yaml), and emits a
      'vendor.created' business event.

