# L1 — admin sub-app (finbot/apps/admin/**, mounted at /admin)
# Schema: FinBot_attack_surface/schema/L1_schema.yaml
# component = "admin" for all records. Live-confirmed via /admin/openapi.json (22 paths, 2026-09-19).
#
# Cross-cutting fact that dominates this whole file:
#   There is NO authentication or role-based authorization boundary between the vendor
#   portal and the admin portal. Every admin route (web and API) depends on
#   get_session_context (finbot/core/auth/middleware.py:156-161) — identical to every
#   vendor route. portal_type="admin" is set purely because the request path starts with
#   "/admin" (finbot/core/auth/middleware.py:44-47) — it is a UI label, not a credential.
#   session_context.is_admin_portal() (session.py:150-151) just re-reads that label.
#   An anonymous, never-authenticated temporary session that simply navigates to
#   /admin/dashboard gets full admin-portal access. Data scoping is by namespace (one
#   per browser/session identity), so "admin view" means "everything created under this
#   one session's own namespace," not a cross-tenant view of other players' data.
#   auth_requirement is therefore "session:temporary" and authz_check_location "none"
#   for every record below unless a stronger in-handler/repository check is noted.

