    evidence: {source_ref: "finbot/apps/admin/routes/api.py:363-382"}
    notes: "list_files() is namespace-scoped only; handler filters IN CODE for vendor_id is None (admin-scoped files, e.g. saved Co-Pilot reports) plus optional file_type — filtering happens after fetch (in_handler), whereas vendor's equivalent passes vendor_id into the query itself (repository_layer)."

  - id: admin.api.findrive.get
    component: admin
    interaction_type: http_route
    method: GET
    path: /api/v1/findrive/{file_id}
    ui_trigger: "findrive.js:173"
    parameters: [{name: file_id, location: path, type: integer, required: true, source: ""}]
    auth_requirement: session:temporary
    authz_check_location: repository_layer
    state_preconditions: []
    reachability: {status: black_box_reachable, notes: ""}
    visibility: black_box_observable
    controls_observed: {csrf: false, rate_limited: false, security_headers: true}
    evidence: {source_ref: "finbot/apps/admin/routes/api.py:385-398"}
    notes: >
      get_file(file_id) is namespace-only — NO vendor_id-is-None check at all, unlike the
      list endpoint's in-handler filter and unlike vendor's by-ID sibling (which 403s on
      vendor_id != current_vendor_id). Any file id in the namespace — including
      vendor-owned invoice/compliance documents — is returned, despite the docstring
      describing it as fetching "an admin file's content." Same list-vs-by-ID scoping gap
      pattern observed in the messages endpoints above.
