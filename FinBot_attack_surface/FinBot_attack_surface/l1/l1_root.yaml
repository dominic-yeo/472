  # -------------------------------------------------------------------------
  # Auth: magic-link sign-in (finbot/apps/finbot/auth.py, prefix /auth)
  # -------------------------------------------------------------------------

  - id: root.auth.check_email
    component: root
    interaction_type: http_route
    method: GET
    path: /auth/check-email
    ui_trigger: "Redirect target after submitting the sign-in email form"
    parameters:
      - {name: email, location: query, type: string, required: false, source: "raw query param, echoed into template"}
    auth_requirement: none
    authz_check_location: none
    state_preconditions: []
    reachability: {status: black_box_reachable, notes: "listed in root openapi.json"}
    visibility: black_box_observable
    controls_observed: {csrf: false, rate_limited: false, security_headers: true}
    evidence: {source_ref: "finbot/apps/finbot/auth.py:232-242"}
    notes: "Redirects to /portals if the caller is already authenticated (_is_authenticated check)."

  - id: root.auth.magic_link_request
    component: root
    interaction_type: http_route
    method: POST
    path: /auth/magic-link
    ui_trigger: "Sign-in form ('Enter your email') on /portals or nav sign-in button"
    parameters:
      - {name: email, location: body, type: string, required: true, source: "Body_request_magic_link_auth_magic_link_post (application/x-www-form-urlencoded, FastAPI Form(...))"}
    auth_requirement: none
    authz_check_location: in_handler
    state_preconditions: []
    reachability: {status: black_box_reachable, notes: "form-encoded POST, exempt from CSRF (/auth/ prefix)"}
    visibility: black_box_observable
    controls_observed: {csrf: false, rate_limited: false, security_headers: true}
    evidence: {source_ref: "finbot/apps/finbot/auth.py:27-81"}
    notes: >
      Creates a MagicLinkToken row (32-byte urlsafe token, expires_at =
      now + MAGIC_LINK_EXPIRY_MINUTES) bound to the CURRENT session_id if one exists.
      Sends the link via finbot.core.email.get_email_service().send_magic_link — no
      rate limiting or per-email throttling observed in source. No account-existence
      signal is leaked in the response (always redirects to /auth/check-email).

  - id: root.auth.magic_link_verify
    component: root
    interaction_type: http_route
    method: GET
    path: /auth/verify
    ui_trigger: "Link clicked from the emailed magic-link message"
    parameters:
      - {name: token, location: query, type: string, required: true, source: "raw query param, looked up against MagicLinkToken.token"}
    auth_requirement: none
    authz_check_location: in_handler
    state_preconditions: ["token not yet used, not expired (MagicLinkToken.is_valid())"]
    reachability: {status: black_box_reachable, notes: ""}
    visibility: black_box_observable
    controls_observed: {csrf: false, rate_limited: false, security_headers: true}
    evidence: {source_ref: "finbot/apps/finbot/auth.py:84-198"}
    notes: >
      On success, upgrades the session tied to token.session_id (or the current
      browser's session, preferring the current one — see comment at auth.py:121-128)
      to a persistent (is_temporary=False) session bound to the token's email via
      SessionManager.upgrade_to_permanent, then sets a fresh session cookie with
      PERM_SESSION_TIMEOUT and redirects to /portals. This is the one state
      transition point where session:temporary -> session:persistent occurs.

  - id: root.auth.logout
    component: root
    interaction_type: http_route
    method: GET
    path: /auth/logout
    ui_trigger: "'Sign out' link/button"
    parameters: []
    auth_requirement: session:temporary
    authz_check_location: dependency
    state_preconditions: []
    reachability: {status: black_box_reachable, notes: ""}
    visibility: black_box_observable
    controls_observed: {csrf: false, rate_limited: false, security_headers: true}
    evidence: {source_ref: "finbot/apps/finbot/auth.py:201-229"}
    notes: "GET (not POST) despite being a state-changing action — deletes the UserSession row and immediately mints a brand-new temporary session, then redirects to /portals."

