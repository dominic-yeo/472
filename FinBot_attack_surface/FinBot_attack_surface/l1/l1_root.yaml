    ui_trigger: null
    parameters: []
    auth_requirement: none
    authz_check_location: none
    state_preconditions: []
    reachability: {status: black_box_reachable, notes: "curl 200 {'status':'ok'}, live"}
    visibility: black_box_observable
    controls_observed: {csrf: false, rate_limited: false, security_headers: true}
    evidence: {black_box: "GET /healthz -> 200 {status: ok}", source_ref: "finbot/main.py:215-218"}
    notes: "Liveness probe for the Railway deployment, not app-specific."

