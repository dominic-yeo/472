# L1 — root FastAPI app (finbot/main.py) and its directly-included routers.
# Scope note: this dataset intentionally excludes the CTF game layer (finbot/apps/ctf/**,
# finbot/ctf/** — challenges, badges, points, hints, leaderboard/profile gamification,
# activity feed, "Hacker Toolkit" dead-drop/exfil views, share cards) and the CTF
# marketing/participation pages under finbot/apps/finbot/routes.py (/, /portals,
# /how-it-works, /about, /stats, /api/pulse, /agreement, /api/log-agreement). Those are
# the scoring/gamification wrapper OWASP built AROUND the target, not the target itself.
# This file covers only the platform infrastructure that the actual vulnerable
# application (vendor portal, admin portal, agentic backend) depends on:
#   - finbot.apps.finbot.auth   (magic-link sign-in, /auth/*)
#   - finbot.core.websocket.routes (/ws/*)
#   - finbot.apps.web.routes   (CineFlow demo tenant, mounted at /demo/cineflow)
#   - static/introspection surfaces
# Schema: FinBot_attack_surface/schema/L1_schema.yaml
# component = "root" for all records in this file.
# Cross-cutting facts that apply to every record below unless noted otherwise:
#   - SessionMiddleware (finbot/core/auth/middleware.py:19) runs on every request except
#     /static/* and /favicon.ico; it silently mints a temporary session (finbot_session
#     cookie, HttpOnly+Secure+SameSite=Lax, 7-day Max-Age) for any request with no/invalid
#     cookie, then stores SessionContext on request.state.session_context.
#   - portal_type on that context is set purely from the URL prefix (startswith("/admin")
#     or startswith("/vendor")) — it is a UI label, not a credential check
#     (finbot/core/auth/middleware.py:44-47).
#   - CSRFProtectionMiddleware (finbot/core/auth/csrf.py) requires header
#     settings.CSRF_HEADER_NAME to match session_context.csrf_token on every
#     POST/PUT/DELETE/PATCH, EXCEPT paths starting with: /api/health, /api/status,
#     /static/, /favicon.ico, /auth/, /ws/test/, /api/log-agreement, /cc/.
#   - Security headers observed live on every response: X-Content-Type-Options: nosniff,
#     X-Frame-Options: DENY, X-XSS-Protection: 1; mode=block. No CSP header observed.
#     No rate-limit headers observed on any probed endpoint.
#   - Live black-box confirmed 2026-09-19 against https://owasp-finbot-ctf.org/.

