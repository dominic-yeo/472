    evidence: {source_ref: "finbot/main.py:158"}
    notes: "CSS/JS/image bundle — primary black-box source for discovering AJAX call shapes/paths that aren't linked from server-rendered HTML."

  - id: root.introspection.docs_root
    component: root
    interaction_type: http_route
    method: GET
    path: /docs
    ui_trigger: null
    parameters: []
    auth_requirement: none
    authz_check_location: none
    state_preconditions: []
    reachability: {status: black_box_reachable, notes: "FastAPI's default Swagger UI is enabled and unauthenticated on the root app"}
    visibility: black_box_observable
    controls_observed: {csrf: false, rate_limited: false, security_headers: true}
    evidence: {black_box: "GET /docs -> 200 text/html; GET /openapi.json -> 200 application/json (confirmed 2026-09-19)"}
    notes: >
      Every mounted sub-app also exposes its own /{prefix}/docs and
      /{prefix}/openapi.json (vendor: 33 paths, admin: 22, darklab: 15, labs: 8 — all
