    parameters: []
    auth_requirement: session:temporary
    authz_check_location: dependency
    state_preconditions: []
    reachability: {status: black_box_reachable, notes: "curl 200, live"}
    visibility: black_box_observable
    controls_observed: {csrf: false, rate_limited: false, security_headers: true}
    evidence:
      black_box: >
        GET /api/session/status -> 200 {session_id (truncated), user_id, is_temporary,
        namespace, security_status:{rotation_count,time_since_rotation,session_age,
        should_rotate,is_too_old,suspicious_activity,fingerprint_protected}, csrf_token}.
        This is the only endpoint that hands the CSRF token to a client explicitly —
        every other page must scrape it from an embedded meta tag / hidden field
        (finbot/core/auth/csrf.py:182-207, csrf_token_meta/csrf_token_field).
      source_ref: "finbot/main.py:222-234"
    notes: "user_id and namespace fully disclosed (namespace = f\"ns_user_{user_id}\", the actual DB partition key used by every NamespacedRepository filter)."

