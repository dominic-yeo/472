  - id: root.ws.test_push
    component: root
    interaction_type: http_route
    method: POST
    path: /ws/test/push
    ui_trigger: null
    parameters:
      - {name: namespace, location: body, type: string, required: true, source: "TestEventRequest"}
      - {name: user_id, location: body, type: string, required: true, source: "TestEventRequest"}
      - {name: event_type, location: body, type: string, required: true, source: "TestEventRequest — must match a WSEventType enum value"}
      - {name: data, location: body, type: object, required: false, source: "TestEventRequest"}
    auth_requirement: none
    authz_check_location: in_handler
    state_preconditions: ["settings.DEBUG must be true, else 404 (finbot/core/websocket/routes.py:35-36)"]
    reachability: {status: blocked_by_control, notes: "gated on DEBUG flag; presumed false in the production deployment (not independently confirmed live to avoid pushing test events to arbitrary user_id/namespace pairs)"}
    visibility: white_box_required
    controls_observed: {csrf: false, rate_limited: false, security_headers: true}
    evidence: {source_ref: "finbot/core/websocket/routes.py:23-54; exempt path '/ws/test/' in csrf.py:35"}
    notes: >
      Lets a caller push an arbitrary WSEvent to any (namespace, user_id) pair with
      no ownership check when DEBUG=true — a debug-only fan-out test hook, not
      reachable in a properly configured deployment.

  - id: root.ws.connect
    component: root
    interaction_type: websocket
    method: WS
    path: /ws/connect
    ui_trigger: "Opened automatically by every portal page's JS on load, to receive live activity/score/badge toasts"
    parameters:
      - {name: namespace, location: query, type: string, required: true, source: "raw query param on the WS upgrade request — NOT cross-checked against the session cookie's own namespace"}
      - {name: user_id, location: query, type: string, required: true, source: "raw query param on the WS upgrade request — NOT cross-checked against the session cookie's own user_id"}
    auth_requirement: none
    authz_check_location: none
    state_preconditions: []
    reachability: {status: black_box_reachable, notes: "not independently opened live; confirmed from source only"}
    visibility: white_box_required
    controls_observed: {csrf: false, rate_limited: false, security_headers: false}
    evidence: {source_ref: "finbot/core/websocket/routes.py:57-121; finbot/core/websocket/manager.py"}
    notes: >
      Not present in openapi.json (WS routes never are) — only discoverable by
      reading the frontend JS bundle or source. CSRFProtectionMiddleware explicitly
      skips any request with an 'upgrade: websocket' header (csrf.py:50-52), and
      SessionMiddleware does the same (middleware.py:27-29), so this path is outside
      both cross-cutting controls. After connect, client can send JSON
      {"action":"subscribe"|"unsubscribe","topic":...} or {"action":"ping"}.

