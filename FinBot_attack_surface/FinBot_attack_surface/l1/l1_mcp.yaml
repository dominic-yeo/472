    auth_requirement: "session:temporary (inherited)"
    authz_check_location: in_handler
    state_preconditions: []
    reachability: {status: black_box_reachable, notes: "trigger via a chat message instructing the assistant to delete a file"}
    visibility: grey_box_required
    controls_observed: {csrf: false, rate_limited: false, security_headers: false}
    evidence: {source_ref: "finbot/mcp/servers/findrive/server.py:144-172"}
    notes: "Same cross-vendor-within-namespace openness as get_file (blocks only vendor_id IS NULL admin files, not other vendors' files). Irreversible (no soft-delete)."

  - id: mcp.findrive.search_files
