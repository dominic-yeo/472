    reachability: {status: black_box_reachable, notes: ""}
    visibility: grey_box_required
    controls_observed: {csrf: false, rate_limited: false, security_headers: false}
    evidence: {source_ref: "finbot/mcp/servers/finmail/server.py:129-184"}
    notes: >
      _is_vendor_session() gate: a vendor-portal session requesting inbox='admin' gets an
      explicit error ("Access denied"). An admin-portal session (current_vendor_id is None)
      has no equivalent restriction and can list ANY vendor's inbox by passing its
      vendor_id — this is the one-directional admin/vendor MCP boundary noted by both the
      admin and vendor subagent traces.

