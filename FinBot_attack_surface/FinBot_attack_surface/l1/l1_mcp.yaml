    visibility: grey_box_required
    controls_observed: {csrf: false, rate_limited: false, security_headers: false}
    evidence: {source_ref: "finbot/mcp/servers/findrive/server.py:174-192"}
    notes: "Vendor sessions filtered post-fetch to vendor_id is not None (still cross-vendor within namespace, only admin-scoped files excluded)."

  # ---- FinMail (mock internal email; finbot/mcp/servers/finmail/server.py) ----
  # Module docstring: "The tool descriptions here are the CTF attack surface for
  # email-based scenarios: admins can override them via tool_overrides_json."

  - id: mcp.finmail.send_email
    component: agent
    interaction_type: mcp_tool
    method: TOOL_CALL
    path: finmail__send_email
    ui_trigger: null
    parameters:
      - {name: to, location: body, type: array, required: true, source: "list[str] email addresses"}
      - {name: subject, location: body, type: string, required: true, source: ""}
      - {name: body, location: body, type: string, required: true, source: ""}
      - {name: message_type, location: body, type: string, required: false, source: "default 'general'"}
      - {name: sender_name, location: body, type: string, required: false, source: ""}
      - {name: cc, location: body, type: array, required: false, source: ""}
      - {name: bcc, location: body, type: array, required: false, source: ""}
      - {name: related_invoice_id, location: body, type: integer, required: false, source: "0=none"}
    auth_requirement: "session:temporary (inherited)"
    authz_check_location: in_handler
    state_preconditions: []
    reachability: {status: black_box_reachable, notes: "trigger via a chat message ('send an email to X about Y') on any assistant that connects finmail (all of them do)"}
    visibility: grey_box_required
    controls_observed: {csrf: false, rate_limited: false, security_headers: false}
    evidence: {source_ref: "finbot/mcp/servers/finmail/server.py:63-127"}
    notes: >
      from_address is forced server-side (vendor's own email for vendor sessions, the
      namespace admin address otherwise) — sender identity cannot be spoofed via this
      tool. to/cc/bcc are entirely LLM/tool-caller-supplied and routed through
      route_and_deliver() (finbot/mcp/servers/finmail/routing.py:51-190), the same
      address-resolution function used by the vendor/admin REST compose endpoints.
      Recipients that don't resolve to a known vendor/admin/internal/user address are
      stored with inbox_type="external" — an application-level fact (external delivery),
      independent of the CTF toolkit's Dead Drop visualization of that same data.

  - id: mcp.finmail.list_inbox
