    visibility: grey_box_required
    controls_observed: {csrf: false, rate_limited: false, security_headers: false}
    evidence: {source_ref: "finbot/mcp/servers/findrive/server.py:116-142"}
    notes: "Metadata only, not content."

  - id: mcp.findrive.delete_file
