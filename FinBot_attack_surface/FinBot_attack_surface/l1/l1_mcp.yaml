# L1 — the agentic/tool-calling layer: MCP server tools (interaction_type: mcp_tool)
# and native per-agent callables (interaction_type: agent_tool_call).
# Schema: FinBot_attack_surface/schema/L1_schema.yaml
#
# `component` deviation: none of these interactions are owned by a single mounted
# HTTP sub-app — they are invoked only indirectly, by an LLM's tool-call decision inside
# a chat/workflow session that itself runs under vendor/admin. We use component="agent"
# for all records in this file and note, per record, which HTTP entry point(s) can reach
# it (see l1_vendor.yaml/l1_admin.yaml sse_stream records and l2_semantic.yaml for the
# full request -> agent -> tool chain).
#
# How reachability/visibility work for this layer:
#   - `path` = the identifier the LLM sees in its `tools` array: bare name for a native
#     agent_tool_call (e.g. "get_vendor_details"), or "{server}__{tool}" for an mcp_tool
#     (finbot/mcp/provider.py:170-172, TOOL_NS_SEP = "__").
#   - `method` = "TOOL_CALL" per schema convention.
#   - `ui_trigger` is always null — there is no button that calls these directly; they
#     are only reachable by writing a chat message (or triggering a background workflow)
#     that causes the LLM to decide to call them. Which HTTP endpoint can trigger that
#     decision is recorded in `notes`.
#   - `reachability.status` = black_box_reachable because any of these tools CAN be
#     invoked purely by conversing with the chat/copilot assistant in natural language —
#     no source access is needed to trigger one, only to know it exists.
#   - `visibility`: MCP tool catalogs (name/description/JSON-schema) are grey_box_required
#     — observable live via GET /darklab/api/v1/supply-chain/servers/{server_type} or
#     GET /admin/api/v1/mcp/servers/{server_type} (both return the default tool list),
#     no source read required. Native agent_tool_call schemas are NOT exposed by any
#     endpoint — those are white_box_required (only visible by reading the agent source
#     or provoking/observing the model's function-call behavior blind).
#
# Common state precondition for every mcp_tool record: the owning agent must have
# connected to that MCP server this run (finbot/agents/base.py:524-536
# BaseAgent._connect_mcp_servers, or finbot/agents/chat.py:111-144
# ChatAssistantBase._connect_mcp), which itself requires
# MCPServerConfig(namespace, server_type).enabled != false
# (finbot/mcp/factory.py:88-95) — a server an admin/darklab user disabled for their own
# namespace is silently withheld from every agent in that namespace.

records:
  # =========================================================================
  # MCP servers — finbot/mcp/servers/**, instantiated per-run via
  # finbot/mcp/factory.py:create_mcp_server(server_type, session_context)
  # =========================================================================

  # ---- FinDrive (mock document store; finbot/mcp/servers/findrive/server.py) ----
  # Module docstring: "Files stored here are the indirect prompt injection delivery
  # mechanism: when agents read 'invoice documents,' poisoned content enters the LLM
  # context window and can influence agent decisions."

  - id: mcp.findrive.upload_file
    component: agent
    interaction_type: mcp_tool
    method: TOOL_CALL
    path: findrive__upload_file
    ui_trigger: null
    parameters:
      - {name: filename, location: body, type: string, required: true, source: "MCP tool inputSchema (LLM-supplied argument)"}
      - {name: content, location: body, type: string, required: true, source: "plain text, no binary/base64 handling"}
      - {name: folder, location: body, type: string, required: false, source: "default '/invoices'"}
      - {name: vendor_id, location: body, type: integer, required: false, source: "0 = unset; vendor sessions default to current_vendor_id if unset"}
      - {name: file_type, location: body, type: string, required: false, source: "default 'pdf'"}
    auth_requirement: "session:temporary (inherited from invoking chat/workflow session)"
    authz_check_location: in_handler
    state_preconditions: ["content size <= max_file_size_kb (default 500KB) enforced only at this MCP layer"]
    reachability: {status: black_box_reachable, notes: "trigger via chat message asking the assistant to save/upload a document"}
    visibility: grey_box_required
    controls_observed: {csrf: false, rate_limited: false, security_headers: false}
    evidence: {source_ref: "finbot/mcp/servers/findrive/server.py:44-86"}
    notes: >
      Reachable from VendorChatAssistant and CoPilotAssistant (both connect 'findrive';
      finbot/agents/chat.py:109,521,745) and from InvoiceAgent/FraudComplianceAgent
      (finbot/agents/specialized/invoice.py:57-66, fraud.py:69-81). Vendor session with
      vendor_id unset defaults to current_vendor_id (server.py:65-67).

  - id: mcp.findrive.get_file
    component: agent
    interaction_type: mcp_tool
    method: TOOL_CALL
    path: findrive__get_file
    ui_trigger: null
    parameters: [{name: file_id, location: body, type: integer, required: true, source: "MCP tool inputSchema"}]
    auth_requirement: "session:temporary (inherited)"
    authz_check_location: in_handler
    state_preconditions: []
    reachability: {status: black_box_reachable, notes: "the model calls this on its own after a chat attachment reference or an invoice/compliance-review task; a user only needs to reference a file_id in conversation or an attached FinDrive file"}
    visibility: grey_box_required
    controls_observed: {csrf: false, rate_limited: false, security_headers: false}
    evidence: {source_ref: "finbot/mcp/servers/findrive/server.py:88-114"}
    notes: >
      Vendor sessions are blocked only from files with vendor_id IS NULL (admin-scoped
      files); access to any OTHER vendor's file within the same namespace is explicitly
      left open per the module docstring ("Cross-vendor access is intentionally left open").
      This differs from the REST route vendor.api.findrive.get (l1_vendor.yaml), which does
      enforce vendor_id==current_vendor_id — i.e. the MCP path to the same FinDriveFile
      table is less restrictive than the REST path. Returns full extracted_text, which
      becomes LLM context on the next turn (indirect prompt injection surface per module
      docstring).

  - id: mcp.findrive.list_files
    component: agent
    interaction_type: mcp_tool
    method: TOOL_CALL
    path: findrive__list_files
    ui_trigger: null
    parameters:
      - {name: folder, location: body, type: string, required: false, source: ""}
      - {name: vendor_id, location: body, type: integer, required: false, source: "0=unset, defaults to current_vendor_id for vendor sessions"}
      - {name: limit, location: body, type: integer, required: false, source: "default 50"}
    auth_requirement: "session:temporary (inherited)"
    authz_check_location: in_handler
