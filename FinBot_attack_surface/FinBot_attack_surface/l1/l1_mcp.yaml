      - {name: vendor_id, location: body, type: integer, required: false, source: "required (>0) when inbox='vendor'"}
      - {name: message_type, location: body, type: string, required: false, source: ""}
      - {name: unread_only, location: body, type: boolean, required: false, source: ""}
