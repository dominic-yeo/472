# L1 ground truth — Dark Lab (finbot/apps/darklab), mounted at /darklab
# "adversary-perspective threat surface for supply chain attacks and
# exfiltration" (finbot/apps/darklab/main.py docstring). This is where MCP
# tool-description poisoning actually lives (admin.py's own comment says
# "Tool definition overrides have moved to Dark Lab (/darklab/supply-chain)").
# Same auth posture as Admin: every route uses bare get_session_context,
# confirmed live at /darklab/ -> 302 -> /darklab/dashboard -> 200 on a fresh
# session (see finbot/apps/darklab/main.py, no auth middleware registered
# beyond the platform-wide SessionMiddleware/CSRF).

- id: darklab.web.home
  component: darklab
  interaction_type: http_route
  method: GET
  path: /darklab/
  auth_requirement: "session:temporary"
  authz_check_location: none
  reachability: {status: black_box_reachable, notes: "confirmed live: 302 -> /darklab/dashboard"}
  visibility: black_box_observable
  evidence: {black_box: "curl -> 302", source_ref: "finbot/apps/darklab/routes/web.py:15-19"}

