- id: darklab.api.supply_chain.tools.update
  component: darklab
  direction: exit
  interaction_type: http_route
  method: PUT
  path: /darklab/api/v1/supply-chain/servers/{server_type}/tools
  parameters:
    - {name: server_type, location: path, type: string, required: true}
    - {name: body, location: body, type: ToolOverridesUpdate, required: true, source: "tool_overrides: dict[tool_name -> override, presumably {description, ...}]"}
  auth_requirement: "session:temporary"
  authz_check_location: none
  state_preconditions: ["CSRF token header present"]
  reachability: {status: black_box_reachable, notes: ""}
  visibility: black_box_observable
  evidence: {source_ref: "finbot/apps/darklab/routes/api.py:107-126"}
  notes: >
    THE tool-poisoning endpoint. This single L1 interaction is the
    realizing endpoint for every ToolPoisoningExfilDetector and
    ToolPoisoningDeletionDetector challenge in the catalog (Double Agent,
    Carte Blanche, Toxic Transfer, Scorched Earth — see l2_full_catalog.yaml).
    No schema validation visible on tool_overrides' shape beyond "dict" —
    accepts arbitrary override content per tool name, stored and later
    substituted wherever the agent reads that tool's description at
    tool-call time (mechanism not traced further in this pass; would
    require reading finbot/mcp/factory.py or provider.py to confirm exactly
    how overrides get spliced into the FastMCP tool registration).

