# L1 ground truth — everything mounted directly on the root FastAPI app
# (finbot/main.py) rather than a sub-app: magic-link auth (finbot/apps/finbot/auth.py,
# prefix /auth), marketing/landing pages (finbot/apps/finbot/routes.py, root
# prefix), the hidden CineFlow demo tenant (finbot/apps/web/routes.py,
# mounted at /demo/cineflow), and a handful of routes defined inline in
# main.py itself.

# --- Magic-link authentication (finbot/apps/finbot/auth.py, prefix /auth) ---

- id: platform.auth.request_magic_link
  component: platform
  direction: [entry, exit]
  interaction_type: http_route
  method: POST
  path: /auth/magic-link
  parameters: [{name: email, location: body, type: "form field (Form(...))", required: true}]
  auth_requirement: "none required to call it; a no-op redirect if already authenticated"
  authz_check_location: in_handler
  reachability: {status: black_box_reachable, notes: ""}
  visibility: black_box_observable
  evidence: {source_ref: "finbot/apps/finbot/auth.py:27-81"}
  notes: >
    Genuine exit point (sends a real email via get_email_service — console
    in dev, Resend in prod) accepting ANY string as `email` with only
    `.lower().strip()` normalization visible — no format validation at this
    layer. token = secrets.token_urlsafe(32), stored with a
    MAGIC_LINK_EXPIRY_MINUTES TTL. Worth checking black-box whether
    repeated calls are rate-limited (not tested in this pass) since this is
    an unauthenticated mail-send primitive, i.e. a potential spam/abuse
    vector independent of any CTF challenge.

- id: platform.auth.verify_magic_link
  component: platform
  interaction_type: http_route
  method: GET
  path: /auth/verify
  parameters: [{name: token, location: query, type: string, required: true}]
  auth_requirement: "none"
  authz_check_location: in_handler
  authz_check_detail: >
    token looked up by exact match, checked via magic_token.is_valid()
    (not independently read in this pass — presumably expiry + used_at
    checks), then marks used_at and upgrades a session to permanent bound
    to magic_token.email.
  reachability: {status: black_box_reachable, notes: ""}
  visibility: black_box_observable
  evidence: {source_ref: "finbot/apps/finbot/auth.py:84-198"}
  notes: >
    Session-fixation-shaped logic worth flagging for a closer read, not
    confirmed exploitable here: the handler explicitly reasons about "which
    session to upgrade" (current browser's vs. the one stored in the token)
    with an inline comment about avoiding two browsers sharing one session
    ID — i.e. the authors were already aware of and defending against a
    specific session-fixation variant. Ground truth should record that the
    defense exists (prefer current_session over magic_token.session_id) and
    treat full verification of its correctness as a dedicated follow-up,
    not assume it's sound just because a comment says so.

- id: platform.auth.logout
  component: platform
  interaction_type: http_route
  method: GET
  path: /auth/logout
  auth_requirement: "none"
  reachability: {status: black_box_reachable, notes: ""}
  visibility: black_box_observable
  evidence: {source_ref: "finbot/apps/finbot/auth.py:201-229"}
  notes: "GET-triggered state change (deletes session, issues new temporary one) — CSRF-shaped concern in general for GET-as-logout patterns, though the worst case here is just forcing a logout, not a privileged action."

- id: platform.auth.check_email_page
  component: platform
  interaction_type: http_route
  method: GET
  path: /auth/check-email
  parameters: [{name: email, location: query, type: string, required: false, source: "default ''"}]
  auth_requirement: "none"
  reachability: {status: black_box_reachable, notes: ""}
  visibility: black_box_observable
  evidence: {source_ref: "finbot/apps/finbot/auth.py:232-242"}
  notes: "email query param is reflected into the confirmation page — check for unescaped reflection (XSS) in a follow-up pass; not tested black-box here."

