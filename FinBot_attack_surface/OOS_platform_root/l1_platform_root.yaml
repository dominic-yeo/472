- id: platform.web.test_error_pages
  component: platform
  interaction_type: http_route
  method: GET
  path: "/test/404, /test/403, /test/400, /test/500, /test/503, /api/test/404, /api/test/500"
  auth_requirement: "none"
  reachability: {status: black_box_reachable, notes: "seven distinct routes, grouped as one record since they're mechanically identical (raise HTTPException(status_code=N))"}
  visibility: black_box_observable
  evidence: {source_ref: "finbot/apps/finbot/routes.py:89-129"}
  notes: >
    Explicitly labeled "for development/testing" in source but has NO
    settings.DEBUG guard and is mounted unconditionally on the production
    root router — confirmed still present in the file as shipped. Low
    individual severity (just triggers styled error pages / raises a
    generic HTTPException with a static detail string — no information
    disclosure beyond what any 404/500 would show), but it's dead weight
    on the production attack surface that a min-effort black-box crawl
    will trip over immediately, and worth a one-line fix (gate behind
    settings.DEBUG) regardless of exploitability.

# --- CineFlow demo tenant (finbot/apps/web/routes.py, mounted /demo/cineflow) ---

- id: platform.demo.cineflow_pages
  component: web
  interaction_type: http_route
  method: GET
  path: "/demo/cineflow/, /about, /work, /partners, /careers, /contact"
  auth_requirement: "none"
  authz_check_location: none
  reachability: {status: black_box_reachable, notes: "confirmed live: GET /demo/cineflow/ -> 200; grouped as one record, six near-identical static-template routes"}
  visibility: grey_box_required
  evidence: {black_box: "curl /demo/cineflow/ -> 200", source_ref: "finbot/apps/web/routes.py; finbot/main.py:178"}
  notes: >
    finbot/main.py:177 comment: "CineFlow demo tenant (hidden, preserved
    for future IPI scenarios)". Textbook case of the visibility/reachability
    split this ground-truth schema exists to capture: NOT linked from
    /portals or any nav discovered during black-box navigation of the rest
    of the platform (visibility: grey_box_required — findable by directory
    guessing/brute force, or trivially by reading main.py white-box), while
    black-box reachability is 200 OK the moment the path is known, no auth,
    no gating. "IPI" = indirect prompt injection; currently inert (a
    fictional media-company marketing site with no forms or agent
    integration visible in routes.py), i.e. a future/placeholder attack
    surface rather than a currently exploitable one — ground truth should
    record it as present-but-dormant, not as a live finding.

# --- Inline routes on the root app (finbot/main.py) ---

- id: platform.web.agreement
  component: platform
  interaction_type: http_route
  method: GET
  path: /agreement
  auth_requirement: "none"
  reachability: {status: black_box_reachable, notes: "confirmed live: 200"}
  visibility: black_box_observable
  evidence: {black_box: "curl /agreement -> 200", source_ref: "finbot/main.py:182-191"}
  notes: "Serves a static HTML file straight off disk on every request (explicit '(TODO) cache this' comment) — availability/perf note, not a security finding."

- id: platform.api.log_agreement
  component: platform
  interaction_type: http_route
  method: POST
  path: /api/log-agreement
  parameters: [{name: body, location: body, type: "raw JSON dict", required: true, source: "userAgent, referrer"}]
  auth_requirement: "session:temporary"
  authz_check_location: none
  reachability: {status: black_box_reachable, notes: ""}
  visibility: black_box_observable
  evidence: {source_ref: "finbot/main.py:195-212"}
  notes: "await request.json() with no Pydantic model — unvalidated arbitrary-shape body, only userAgent/referrer read out via .get(). Purely an audit-log write (emits platform.agreement_accepted); low-value target but worth noting as the one route on the whole platform parsing raw JSON instead of a typed model."

- id: platform.api.healthz
  component: platform
  interaction_type: http_route
  method: GET
  path: /healthz
  auth_requirement: "none"
  reachability: {status: black_box_reachable, notes: "confirmed live: 200"}
  visibility: black_box_observable
  evidence: {black_box: "curl /healthz -> 200 {\"status\":\"ok\"}", source_ref: "finbot/main.py:215-218"}
  notes: "The ACTUAL liveness probe for load balancers, distinct from and reachable where cc.api.health (behind maintainer auth) is not — sensible split, worth recording explicitly since a black-box tester could otherwise wrongly conclude the platform has no working health endpoint after hitting the 403 on /cc/health."

- id: platform.api.session_status
  component: platform
  interaction_type: http_route
  method: GET
  path: /api/session/status
  auth_requirement: "session:temporary"
  authz_check_location: none
  reachability: {status: black_box_reachable, notes: "confirmed live: 200, see vendor_portal ground truth file header for a full sample response"}
  visibility: black_box_observable
  evidence: {black_box: "curl -> 200 {session_id, user_id, is_temporary, namespace, security_status, csrf_token}", source_ref: "finbot/main.py:221-234"}
  notes: >
    THE endpoint that hands out the CSRF token needed for every other
    state-changing request catalogued across this entire ground truth —
    functionally a prerequisite `state_precondition` for every "CSRF token
    header present" entry elsewhere, recorded once here rather than
    threaded as a dependency edge through 60+ individual records. Also
    discloses namespace and a truncated session_id/user_id — namespace in
    particular is a meaningful recon value (it's the isolation boundary
    this entire multi-tenant platform relies on) handed out to any caller
    with zero authentication.

- id: platform.websocket
  component: platform
  interaction_type: websocket
  method: WS
  path: "not enumerated in this pass — finbot/core/websocket/websocket_router mounted via app.include_router at finbot/main.py:172, actual path(s) not read"
  auth_requirement: "unknown — not verified in this pass"
  reachability: {status: black_box_reachable, notes: "README lists 'Real-time scoring via WebSocket notifications' as a shipped feature; SessionMiddleware explicitly special-cases 'upgrade: websocket' requests to skip its own session logic (finbot/core/auth/middleware.py:27-29), meaning WS connections may bypass the session-cookie machinery entirely -- flagged as an open item requiring a dedicated read of finbot/core/websocket/ before this record can be considered complete"}
  visibility: white_box_required
  evidence: {source_ref: "finbot/main.py:172; finbot/core/auth/middleware.py:27-29"}
  notes: "Explicitly incomplete record — placeholder for a follow-up pass rather than a confirmed-empty finding. Do not treat the 'unknown' auth_requirement as 'no auth'; it means 'not yet checked.'"
