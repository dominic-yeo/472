- id: vendor.api.vendors.switch
  component: vendor
  direction: entry
  interaction_type: http_route
  method: POST
  path: /vendor/api/v1/vendors/switch/{vendor_id}
  ui_trigger: "vendor switcher dropdown (multi-vendor sessions only)"
  parameters:
    - {name: vendor_id, location: path, type: int, required: true, source: ""}
  auth_requirement: "session:temporary"
  authz_check_location: [dependency, repository_layer]
  authz_check_detail: >
    NOTE: unlike its sibling handlers (get/update/delete/request-review),
    this handler has no explicit `vendor.id != current_vendor_id` check —
    it relies solely on get_vendor()'s namespace filter. Within the same
    namespace this is not exploitable (any vendor in your own namespace is
    intentionally switchable), but it's an inconsistency worth flagging:
    if NamespacedRepository's filter were ever weakened, this endpoint has
    no second layer of defense where its siblings do.
  reachability: {status: black_box_reachable, notes: ""}
  visibility: black_box_observable
  controls_observed: {csrf: true, rate_limited: unknown, security_headers: true}
  evidence: {source_ref: "finbot/apps/vendor/routes/api.py:369-409"}
  notes: ""

