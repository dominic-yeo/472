# L1 ground truth — Vendor Portal JSON API
# Source: finbot/apps/vendor/routes/api.py, router prefix "/api/v1", mounted
# under /vendor -> full paths are /vendor/api/v1/...
# Cross-cutting facts confirmed live against https://owasp-finbot-ctf.org :
#  - every endpoint below accepts a temporary (anonymous, unbound) session —
#    none require magic-link email verification (get_authenticated_session_context
#    is defined in finbot/core/auth/middleware.py but NOT used anywhere in
#    this router; grep confirms only get_session_context is imported).
#  - all state-changing methods (POST/PUT/DELETE) require a CSRF header;
#    confirmed live: POST /vendor/api/v1/vendors/register without it -> 403
#    {"error":{"code":403,"type":"csrf_error", ...}} (finbot/core/auth/csrf.py)
#  - VendorRepository / InvoiceRepository / EmailRepository / FinDriveFileRepository
#    all extend NamespacedRepository (finbot/core/data/repositories.py:31-45),
#    which injects a `namespace == self.namespace` filter into every query
#    before any explicit ownership check runs. This is the actual IDOR
#    boundary for this app, not the per-handler `!= current_vendor_id` checks,
#    which are redundant defense-in-depth on top of it, or the only check
#    (e.g. switch_vendor, below) where the repo-layer filter is what actually
#    protects it.

- id: vendor.api.vendors.register
  component: vendor
  direction: entry
  interaction_type: http_route
  method: POST
  path: /vendor/api/v1/vendors/register
  ui_trigger: "onboarding form submit"
  parameters:
    - {name: body, location: body, type: VendorRegistrationRequest, required: true,
       source: "company_name, vendor_category, industry, services, name, email, phone?, tin, bank_account_number, bank_name, bank_routing_number, bank_account_holder_name"}
  auth_requirement: "session:temporary"
  authz_check_location: dependency
  state_preconditions: ["CSRF token header present"]
  reachability: {status: black_box_reachable, notes: ""}
  visibility: black_box_observable
  controls_observed: {csrf: true, rate_limited: unknown, security_headers: true}
  evidence:
    black_box: "curl POST without CSRF header -> 403 csrf_error; with valid csrf_token from /api/session/status, expected 200"
    source_ref: "finbot/apps/vendor/routes/api.py:89-151"
  notes: >
    Full financial PII (tin, bank_account_number, bank_routing_number,
    bank_account_holder_name) accepted with only Pydantic type validation —
    no format/checksum validation visible in the request model. Also an L1
    exit point: schedules run_orchestrator_agent as a BackgroundTask
    (see vendor.l2.register_vendor_triggers_onboarding_agent).

