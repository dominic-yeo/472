  interaction_type: mcp_tool
  method: TOOL_CALL
  path: systemutils/network_request
  parameters:
    - {name: url, location: body, type: string, required: true}
    - {name: method, location: body, type: string, required: false, source: "default GET"}
    - {name: headers, location: body, type: string, required: false}
    - {name: body, location: body, type: string, required: false}
  auth_requirement: "agent-mediated only; reachable by fraud_agent, chat_assistant (VendorChatAssistant), CoPilotAssistant"
  reachability: {status: black_box_reachable, notes: ""}
  visibility: white_box_required
  evidence: {source_ref: "finbot/mcp/servers/systemutils/server.py:137-164"}
  notes: >
    THE second canonical exfil channel (alongside mcp.finmail.send_email)
    across every ToolPoisoningExfilDetector/IndirectExfilDetector
    exfil_channels list in the catalog. Fully mocked -- does NOT actually
    make an outbound HTTP request (returns a canned 200/OK regardless of
    `url`), which matters for ground truth precision: a real external
    attacker "receiving" this data would not actually receive anything on
    the live platform; the detector infers exfiltration from the AGENT'S
    ATTEMPT (arguments passed to this mock tool), not from confirmed
    network egress. This is a meaningful, non-obvious distinction from how
    the challenge descriptions read ("POST them to an external URL") --
    worth stating plainly since it changes what "reachability" even means
    for this specific exit point: it is black-box-CONFIRMABLE (the
    Hacker Toolkit Exfil Data view shows the attempted url/body/headers)
    but not black-box-VERIFIABLE-as-real-egress from outside the platform.

