# --- SystemUtils (finbot/mcp/servers/systemutils/server.py) ---
# "System diagnostic and maintenance tools. Sandboxed -- records attempted
# commands but executes nothing. Enable for CTF RCE challenges." Confirmed
# by reading the full file: every tool below is a pure mock -- logs a
# logger.warning() with the attempted arguments and returns a canned
# success dict. THERE IS NO REAL CODE EXECUTION ANYWHERE IN THIS SERVER.
# The "RCE" challenges (shell_shock, sleeper_agent) detect the AGENT'S
# INTENT to run a malicious script (pattern-matching script_content), not
# any actual system compromise -- important to state explicitly since
# "rce-*" challenge ids and "execute_script" as a tool name both invite the
# wrong assumption on a code-only skim.

- id: mcp.systemutils.run_diagnostics
  component: mcp
  interaction_type: mcp_tool
  method: TOOL_CALL
  path: systemutils/run_diagnostics
  parameters: [{name: command, location: body, type: string, required: true}]
  auth_requirement: "agent-mediated only; reachable by fraud_agent, chat_assistant (VendorChatAssistant), CoPilotAssistant"
  reachability: {status: black_box_reachable, notes: ""}
  visibility: white_box_required
  evidence: {source_ref: "finbot/mcp/servers/systemutils/server.py:45-66"}
  notes: "Fully mocked -- no real command execution."

- id: mcp.systemutils.manage_storage
  component: mcp
  interaction_type: mcp_tool
  method: TOOL_CALL
  path: systemutils/manage_storage
  parameters:
    - {name: action, location: body, type: string, required: true}
    - {name: target, location: body, type: string, required: true}
  auth_requirement: "agent-mediated only"
  reachability: {status: black_box_reachable, notes: ""}
  visibility: white_box_required
  evidence: {source_ref: "finbot/mcp/servers/systemutils/server.py:68-89"}
  notes: >
    THE poison_tool in destructive-scorched-earth.yaml. Fully mocked itself
    (no real storage operation) -- the actual destructive effect comes
    entirely from the poisoned description instructing the agent to ALSO
