# L1 ground truth — MCP tool servers (finbot/mcp/servers/*), the
# interaction_type: mcp_tool layer. These are never reached directly by a
# browser; they're reached only via an LLM agent's tool-call decision
# during a workflow, or introspected (name/description/schema, not
# invoked) via admin.api.mcp.servers.get / darklab.api.supply_chain.servers.*.
# Each tool's actual behavior is fully mocked (no real external system) —
# confirmed by reading every server.py in finbot/mcp/servers/. Reachability
# for every item below is therefore always agent-mediated: "black-box
# reachable" here means "reachable by an unauthenticated player getting
# *some* agent to call it," not "directly callable over HTTP."
#
# Agent-to-server capability matrix (white-box, from finbot/agents/*.py —
# this is the actual ground truth for which agent can reach which exit
# point, referenced by id from every L2 record in l2_full_catalog.yaml):
#   onboarding_agent    (VendorOnboardingAgent)  -- no MCP servers (native tools only)
#   invoice_agent       (InvoiceAgent)            -- taxcalc, findrive
#   payments_agent      (PaymentsAgent)           -- finstripe, taxcalc
#   communication_agent (CommunicationAgent)      -- finmail
#   fraud_agent         (FraudComplianceAgent)    -- findrive, systemutils, finmail
#   chat_assistant       (ChatAssistantBase, base) -- findrive, finmail
#     -> chat_assistant  (VendorChatAssistant override) -- findrive, finmail, systemutils
#     -> (CoPilotAssistant, admin/CC copilot)      -- findrive, finmail, systemutils
# Tool descriptions are all poisonable via darklab.api.supply_chain.tools.update,
# per-namespace, per-server, per-tool — the override mechanism itself lives
# outside these server.py files (not traced further in this pass; would need
# finbot/mcp/factory.py or provider.py to confirm exactly how an override
# gets spliced into what the agent's LLM sees at tool-call time).

