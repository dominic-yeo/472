# L2 — Semantic/stateful attack surface schema
# One record = one business-meaningful operation, which may be realized by
# one or more L1 interactions, and may produce effects beyond the
# HTTP response (DB writes, emitted events, agent-mediated side effects).
#
# Derived from the OWASP Attack Surface Analysis Cheat Sheet's "data flow
# across trust boundaries" concept, refined against OWASP FinBot CTF.

fields:
  id:
    status: added
    type: string
    desc: e.g. "vendor.invoice.create_and_process"

  semantic_operation:
    status: added
    type: string
    desc: >
      Business-level verb, not an HTTP verb — e.g. "submit invoice for AI
      review", "poison an MCP tool description", "delete a vendor's file
      via the chat assistant". ASA has no notion of a business operation
      distinct from its transport; here one endpoint (POST /chat) can
      realize many different semantic operations depending on the natural-
      language content of the request body, so the mapping has to be
      explicit rather than 1:1 with L1.

  business_objects:
    status: added
    type: list[string]
    desc: >
      Domain entities touched, e.g. Vendor, Invoice, FinDriveFile,
      EmailMessage, MCPToolDescription, ChallengeAttempt, AgentSession.

  realizing_l1_ids:
    status: added
    type: list[string]
    desc: >
      Many-to-many link to L1 records. One L2 operation can require a
      sequence of L1 calls (e.g. register vendor -> poll dashboard ->
      chat), and one L1 record (POST /vendor/api/v1/chat) can realize many
      different L2 operations depending on payload content.

  actor_model:
    status: added
    type: object {performs, affects}
    desc: >
      Who initiates the operation vs who is harmed/benefits. Ordinary CRUD
      threat modeling assumes these are the same actor; agentic apps break
      that assumption routinely — e.g. in "Double Agent"
      (finbot/ctf/definitions/challenges/data_exfiltration/double_agent.yaml)
      an admin-role action (editing a tool description) is what performs
      the operation, but the fraud_agent (acting on behalf of the platform)
      is what actually triggers the harmful effect, later and in an
      unrelated request.

  preconditions:
    status: modified
    type: list[string]
    desc: >
      Concrete required state (session tier, role, prior operations
      completed, feature/guardrail config), replacing ASA's abstract
      trust-level framing — same rationale as L1.auth_requirement.

  effect_state_transition:
    status: added
    type: string
    desc: >
      What actually changes: DB rows created/updated/deleted, Redis event
      emitted, email sent, agent memory/context updated, tool description
      mutated.

  trust_boundary_crossing:
    status: added
    type: enum [immediate, delayed_agent_mediated, none]
    desc: >
      immediate = effect happens synchronously within the triggering
      request/response. delayed_agent_mediated = the operation plants
      attacker-influenced state that an AI agent later reads and acts on
      in a *different* request, on someone else's behalf, crossing a trust
      boundary the agent doesn't realize it's crossing. This is the core
      mechanic of most challenges under
      finbot/ctf/definitions/challenges/{data_exfiltration,rce,destructive}
      and has no analogue in the original ASA cheat sheet, which assumes a
      direct caller -> handler relationship.

  operation_dependencies:
    status: modified
    type: list[string]
    desc: >
      Ordering/prerequisite chain. Maps directly onto the `prerequisites:`
      field already used in this repo's challenge YAML, reused verbatim
      rather than reinvented.

  observable_evidence:
    status: modified
    type: list[string]
    desc: >
      Black-box-visible signals that the effect occurred: UI state change,
      HTTP response diff, WebSocket score/badge toast, an entry appearing
      in the CTF Hacker Toolkit (Dead Drop / Exfil Data views), an email
      visible in the console/dev inbox. Where the target environment has
      its own automated success oracle (this repo's detector_class +
      detector_config per challenge YAML, a WAF/SIEM alert, a test
      assertion), record it as one more evidence entry here rather than as
      a dedicated field — not every environment being annotated will have
      one, and where it exists it's just a stronger-than-usual instance of
      "evidence," not a different kind of fact.

  taxonomy_labels:
    status: added
    type: object {owasp_llm, owasp_agentic, cwe, mitre_atlas}
    desc: >
      Passed through from the challenge YAML `labels:` block where one
      exists, rather than inventing a parallel category scheme.

  visibility:
    status: added
    type: enum [black_box_observable, grey_box_required, white_box_required]
    desc: >
      Minimum access to understand *what this operation does*
      semantically — distinct from L1 visibility (knowing the endpoint
      exists) and from reachability (being able to trigger it). E.g. an
      admin can black-box-observe that a "tool description" field exists
      and is editable without grey/white-box access revealing that editing
      it changes what an unrelated agent does three requests later.

  reachability:
    status: added
    type: object {status, notes}
    desc: >
      Same status vocabulary as L1.reachability, but answering "can this
      operation actually be triggered end-to-end in this deployment" —
      e.g. an operation whose detector exists and whose L1 endpoints are
      live, but whose triggering agent is behind an LLM_PROVIDER that
      isn't configured, is white-box-confirmed-present but
      black-box-unreachable until an API key is supplied.

  source_ref:
    status: added
    type: string
    desc: file:line for the primary handler(s)/detector implementing this.

  notes:
    status: added
    type: string

removed_from_asa_baseline:
  - field: "generic 'data flow across trust boundary' narrative field"
    reason: >
      Split into two typed fields (effect_state_transition +
      trust_boundary_crossing) because the free-text version doesn't
      distinguish "boundary crossed once, synchronously" from "boundary
      crossed later, by a different actor" — a distinction that determines
      whether black-box testing alone can ever surface the finding.
