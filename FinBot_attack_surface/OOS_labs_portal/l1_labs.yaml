- id: labs.api.guardrails.config.get
  component: labs
  interaction_type: http_route
  method: GET
  path: /labs/api/v1/guardrails
  auth_requirement: "session:temporary"
  authz_check_location: repository_layer
  reachability: {status: black_box_reachable, notes: ""}
  visibility: black_box_observable
  evidence: {source_ref: "finbot/apps/labs/routes/guardrails.py:45-57"}
  notes: "Returns signing_secret in cleartext in the JSON body — an HMAC secret the player is meant to use to verify webhook authenticity, so this is by-design self-service, but worth flagging as PII/secret-shaped data returned over a bare-session GET."

- id: labs.api.guardrails.config.upsert
  component: labs
  direction: exit
  interaction_type: http_route
  method: PUT
  path: /labs/api/v1/guardrails
  parameters:
    - {name: body, location: body, type: GuardrailConfigRequest, required: true, source: "webhook_url (max 2048 chars), hooks: dict[str,bool]?, timeout_seconds (1-30, default 5), enabled (default true)"}
  auth_requirement: "session:temporary"
  authz_check_location: none
  state_preconditions: ["CSRF token header present"]
  reachability: {status: black_box_reachable, notes: ""}
  visibility: black_box_observable
  evidence: {source_ref: "finbot/apps/labs/routes/guardrails.py:60-80"}
  notes: >
    `webhook_url` is player-supplied and the platform will later make
    outbound HTTP calls to it (see labs.api.guardrails.test and the
    before_tool/after_tool hook firing on every agent tool call once
    configured) — an SSRF-shaped exit point worth checking for
    internal-address filtering; not verified black-box in this pass
    (would require registering a webhook pointed at a private/metadata
    address and observing whether the platform's outbound call succeeds).

