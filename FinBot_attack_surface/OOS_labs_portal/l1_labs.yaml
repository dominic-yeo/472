# L1 ground truth — FinBot Labs (finbot/apps/labs), mounted at /labs
# Same bare-session auth posture as Admin/Dark Lab. This is the "blue team"
# surface: players configure an outbound webhook that the platform calls
# before/after every agent tool call, and must write defensive logic in
# code they host themselves (not part of this app) to earn labs_guardrail
# challenge points. See finbot/guardrails/service.py for the invocation
# side (not read in this pass beyond routes.py's usage) and
# l2_full_catalog.yaml for Guardrail 101 / Carte Noire.

- id: labs.web.home
  component: labs
  interaction_type: http_route
  method: GET
  path: /labs/
  auth_requirement: "session:temporary"
  authz_check_location: none
  reachability: {status: black_box_reachable, notes: "confirmed live: 302 -> /labs/guardrails"}
  visibility: black_box_observable
  evidence: {black_box: "curl -> 302", source_ref: "finbot/apps/labs/routes/web.py:15-19"}

- id: labs.web.guardrails
  component: labs
  interaction_type: http_route
  method: GET
  path: /labs/guardrails
  auth_requirement: "session:temporary"
  authz_check_location: none
  reachability: {status: black_box_reachable, notes: "confirmed live: 200"}
  visibility: black_box_observable
  evidence: {source_ref: "finbot/apps/labs/routes/web.py:22-27"}

- id: labs.web.guardrails_activity
