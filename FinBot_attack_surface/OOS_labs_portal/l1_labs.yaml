- id: labs.api.guardrails.activity
  component: labs
  interaction_type: http_route
  method: GET
  path: /labs/api/v1/guardrails/activity
  parameters: [{name: limit, location: query, type: int, required: false, source: "default 50, clamped to 200"}]
  auth_requirement: "session:temporary"
  authz_check_location: [in_handler, repository_layer]
  authz_check_detail: "filters CTFEventRepository events to category='agent' then post-filters in Python to agent_name=='guardrail'"
  reachability: {status: black_box_reachable, notes: ""}
  visibility: black_box_observable
  evidence: {source_ref: "finbot/apps/labs/routes/guardrails.py:151-166"}
