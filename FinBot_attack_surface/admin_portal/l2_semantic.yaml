# L2 ground truth — Admin Portal semantic/stateful operations.
# All plain-CRUD/config semantics — no LLM/agent in the loop. The
# agent-mediated flows reachable FROM this portal (Finance Co-Pilot chat,
# tool poisoning consequences) are recorded in l2_full_catalog.yaml instead,
# since those operations' realizing_l1_ids span admin+darklab+mcp_servers
# and don't belong to Admin alone.

- id: admin.l2.crud.mcp_server_config
  semantic_operation: "Read and overwrite the config dict for any MCP server, in the caller's own namespace, via the REST API"
  business_objects: [MCPServerConfig]
  realizing_l1_ids: [admin.api.mcp.servers.list, admin.api.mcp.servers.get, admin.api.mcp.servers.update_config]
  actor_model: {performs: "any session (no role check — see admin_portal/l1_admin.yaml file header)", affects: "every agent in the namespace that reads this server's config at tool-creation time"}
  preconditions: ["CSRF token present for the PUT"]
  effect_state_transition: >
    update_config accepts `config: dict` with NO schema validation against
    the server's actual expected keys (confirmed: ServerConfigUpdate is
    just `config: dict`, finbot/apps/admin/routes/api.py:76-77). Whatever
    is stored here is merged into DEFAULT_CONFIG the next time a server
    factory function runs (create_findrive_server et al., pattern:
    `{**DEFAULT_CONFIG, **(server_config or {})}`).
  trust_boundary_crossing: immediate
  operation_dependencies: []
  observable_evidence: ["admin.api.mcp.servers.get reflects the new config immediately"]
  taxonomy_labels:
    cwe: ["CWE-20:Improper Input Validation", "CWE-840:Business Logic Errors"]
  visibility: black_box_observable
  reachability: {status: black_box_reachable, notes: "confirmed live on a completely fresh anonymous session"}
  source_ref: "finbot/apps/admin/routes/api.py:76-171"
  notes: >
    THE write path for the finding recorded in full at
    vendor_portal/l2_semantic.yaml#vendor.l2.crud.invoice_amount_no_backstop:
    raising or lowering finstripe.max_payment through this endpoint has NO
    effect on finstripe.create_transfer's actual behavior (that tool never
    reads the key at all), so this operation's "config" framing is
    misleading on its own — the L1 record alone would suggest a business
    control exists here; only cross-referencing the MCP tool's actual
    implementation (l1_mcp_servers.yaml) reveals it doesn't. Recorded here
    rather than duplicated in full to keep the one confirmed fact in one
    place; this record exists so the write-side of that finding has its
    own entry point in the dataset independent of which subsystem someone
    starts reading from.

    Separately, unvalidated config also reaches systemutils.enabled_tools
    (a list gating which of the 8 systemutils tools are "on") and
    findrive.max_file_size_kb/max_files_per_vendor — none of these were
    checked in this pass for whether the enforcing code actually reads
    them correctly (only finstripe.max_payment and findrive.max_file_size_kb
    were verified; the former is dead config, the latter IS enforced by the
    MCP tool path per vendor_portal's findrive_file_lifecycle record, but
    only that path, not the REST upload path).

- id: admin.l2.crud.mcp_server_toggle
  semantic_operation: "Enable or disable an entire MCP server for the caller's namespace"
  business_objects: [MCPServerConfig]
  realizing_l1_ids: [admin.api.mcp.servers.toggle]
  actor_model: {performs: "any session", affects: "every agent that would otherwise connect to this server for the rest of the namespace's session"}
  preconditions: ["CSRF token present"]
  effect_state_transition: "MCPServerConfig.enabled flips; downstream effect on agent tool-availability not traced in this pass (not confirmed whether _connect_mcp_servers in finbot/agents/base.py actually checks this flag before connecting, or whether it's purely advisory/UI-only)."
  trust_boundary_crossing: immediate
  operation_dependencies: []
  observable_evidence: ["admin.api.mcp.servers.get reflects the new enabled value"]
  taxonomy_labels: {}
  visibility: white_box_required
  reachability: {status: black_box_reachable, notes: ""}
  source_ref: "finbot/apps/admin/routes/api.py:177-190"
  notes: >
    Flagged as an OPEN ITEM rather than a finding: if this flag is
    genuinely enforced, a player could self-disable systemutils to remove
    it as a target (irrelevant, self-harming) or, more interestingly,
    disable it for OTHER reasons related to a specific challenge's
    prerequisites (e.g. does disabling systemutils change fraud_agent's
    tool-binding at connect time in a way that affects sleeper_agent's
    reachability?). Not traced to finbot/agents/base.py's
    _connect_mcp_servers implementation in this pass.

- id: admin.l2.crud.findrive_admin_scope
  semantic_operation: "Read admin-owned (vendor_id IS NULL) FinDrive files via the REST API"
  business_objects: [FinDriveFile]
  realizing_l1_ids: [admin.api.findrive.list, admin.api.findrive.get]
  actor_model: {performs: "any session", affects: "read access to admin-scoped documents, and POSSIBLY vendor-scoped ones — see below"}
  preconditions: []
  effect_state_transition: none
  trust_boundary_crossing: none
  observable_evidence: []
  taxonomy_labels: {}
  visibility: grey_box_required
  reachability: {status: black_box_reachable, notes: "the divergence below is unconfirmed black-box in this pass"}
  operation_dependencies: []
  source_ref: "finbot/apps/admin/routes/api.py:363-398"
  notes: >
    Repeating the l1_admin.yaml finding as its own L2 record since it's a
    business-object-access-scope question, not just an endpoint fact:
    admin.api.findrive.list explicitly filters to `f.vendor_id is None`
    (admin-only files), but admin.api.findrive.get(file_id) has NO such
    filter — it calls the same namespace-scoped get_file(file_id) the
    vendor endpoints use, with no additional vendor_id IS NULL check. If a
    file_id belonging to a real vendor is guessed or learned (e.g. from
    admin.api.mcp.activity.list's audit trail, which logs file_ids from
    agent tool calls), this endpoint may return that vendor's file content
    to any session with zero role check. UNVERIFIED — flagged as
    PLAUSIBLE pending an actual test (create a vendor file, note its id,
    fetch it via admin.api.findrive.get with a different/fresh session).
