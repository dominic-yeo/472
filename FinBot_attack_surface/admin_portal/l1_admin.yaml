# L1 ground truth — Admin Portal (finbot/apps/admin), mounted at /admin
#
# HEADLINE FACT, confirmed both black-box (live, fresh anonymous cookie jar
# against owasp-finbot-ctf.org) and white-box (grep of the router files):
# every route below uses ONLY `Depends(get_session_context)` — the same
# bare "you have a session" dependency as the Vendor Portal. There is NO
# role check anywhere in finbot/apps/admin/routes/{api,web}.py. A brand-new,
# never-before-seen session gets full read/write access to MCP server
# configs, admin-scoped FinDrive files, the admin inbox, and the Finance
# Co-Pilot chat, with zero prior interaction.
#   curl -c fresh_cookies.txt https://owasp-finbot-ctf.org/admin/api/v1/mcp/servers
#   -> HTTP 200 with full server configs, on the very first request.
# This is almost certainly intentional CTF design, not an oversight: the
# "Double Agent"/"Carte Blanche"/"Toxic Transfer" challenge text explicitly
# instructs players to poison tools "via the Admin Portal" (though the tool-
# override endpoints have since moved to Dark Lab — see darklab catalog;
# the admin portal text still says this, a small doc/code drift). The
# platform's REAL access-gated admin surface is the Command Center (/cc,
# see l1_cc.yaml), which the code and its docstring literally distinguish
# as "for FinBot CTF maintainers" vs. this player-facing "Admin Portal."
# Ground truth here therefore records auth_requirement as session:temporary
# throughout, with this note attached rather than repeated per item.

- id: admin.web.home
  component: admin
  direction: entry
  interaction_type: http_route
  method: GET
  path: /admin/
  ui_trigger: "portals page 'Admin Portal' link"
  auth_requirement: "session:temporary"
  authz_check_location: none
  reachability: {status: black_box_reachable, notes: "confirmed live: 302 -> /admin/dashboard on a fresh session"}
  visibility: black_box_observable
  evidence: {source_ref: "finbot/apps/admin/routes/web.py:15-19"}

