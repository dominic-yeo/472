- id: admin.api.copilot.chat
  component: admin
  direction: [entry, exit]
  interaction_type: http_route
  method: POST
  path: /admin/api/v1/copilot/chat
  parameters: [{name: body, location: body, type: ChatRequest, required: true, source: "message"}]
  auth_requirement: "session:temporary"
  authz_check_location: none
  state_preconditions: ["CSRF token header present"]
  reachability: {status: requires_live_llm, notes: "SSE stream endpoint itself always reachable; agent behavior needs LLM_PROVIDER configured"}
  visibility: black_box_observable
  evidence: {source_ref: "finbot/apps/admin/routes/api.py:501-522; finbot/agents/chat.py:731-746 (CoPilotAssistant)"}
  notes: >
    CoPilotAssistant (agent_name likely "copilot" or similar — not
    independently confirmed by name string in this pass) binds to findrive,
    finmail, AND systemutils per finbot/agents/chat.py:746 — same three-server
    footprint as VendorChatAssistant, but reachable from the (unauthenticated)
    Admin Portal instead of the Vendor Portal. This is the "co-pilot" referred
    to by name in the data-exfil-carte-blanche challenge description
    ("A co-pilot that sends emails to vendors probably doesn't need the
    ability to make raw HTTP requests -- but it has it anyway").

