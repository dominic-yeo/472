- id: admin.api.mcp.servers.update_config
  component: admin
  interaction_type: http_route
  method: PUT
  path: /admin/api/v1/mcp/servers/{server_type}
  parameters:
    - {name: server_type, location: path, type: string, required: true}
    - {name: body, location: body, type: ServerConfigUpdate, required: true, source: "config: dict (arbitrary)"}
  auth_requirement: "session:temporary"
  authz_check_location: none
  state_preconditions: ["CSRF token header present (platform-wide CSRF middleware; not independently re-verified per admin endpoint in this pass)"]
  reachability: {status: black_box_reachable, notes: ""}
  visibility: black_box_observable
  evidence: {source_ref: "finbot/apps/admin/routes/api.py:157-171"}
  notes: >
    `config: dict` is accepted with no schema validation against the
    server's actual expected keys — e.g. finstripe.max_payment,
    systemutils.enabled_tools. Directly relevant to policy_bypass-style
    reasoning: this is a config surface, not itself a poisoning surface
    (tool description overrides live in Dark Lab, not here).

