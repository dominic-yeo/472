  evidence: {source_ref: "finbot/apps/cc/routes/users.py:310+"}
  notes: >
    Most destructive single operation found across the whole platform
    (full per-player CTF progress wipe) — the fact that this, kill-sessions,
    delete-profile, and the access-grant endpoint are ALL behind the one
    real RBAC gate, while every genuinely exploitable game-content surface
    (tool poisoning, agent chat, vendor CRUD) sits behind nothing but a
    session cookie, is itself the clearest piece of ground truth in this
    whole sweep about where this application's actual trust boundary is
    drawn: game-content mutation is intentionally open (it's the CTF),
    platform/player-account mutation is not.
