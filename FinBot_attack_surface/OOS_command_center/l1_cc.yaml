# L1 ground truth — Command Center (finbot/apps/cc), mounted at /cc
#
# The ONE genuinely access-gated subsystem on this platform. Every route is
# wrapped by app-wide middleware (finbot/apps/cc/main.py:28-34,
# enforce_cc_auth -> cc_auth_guard in finbot/apps/cc/auth.py:76-87):
#   1. Requires a PERSISTENT session with a bound, non-null email
#      (session:temporary is rejected outright — no magic-link, no access)
#   2. That email must be_active in the `platform_admins` DB table, seeded
#      once at startup from CC_ALLOWED_EMAILS (env var), with the DB as
#      source of truth thereafter (env is bootstrap-only; DB can revoke
#      even an env-listed email via is_active=False)
# Confirmed live: fresh anonymous session -> GET /cc/ -> HTTP 403 with a
# branded "Access Denied" HTML page, before even reaching a specific route
# handler. This is app-wide middleware, not per-route dependencies, so
# reachability is uniform across every item below — recorded once here
# rather than repeated 24 times.
#
# CAVEAT: none of these were probed authenticated in this pass (doing so
# would require a real CC_ALLOWED_EMAILS-listed account, which this
# black-box pass does not have). All entries below are white-box-derived
# from finbot/apps/cc/routes/*.py; the 403 boundary itself is black-box
# confirmed, the authenticated behavior behind it is not.

- id: cc.access_boundary
  component: cc
  interaction_type: http_route
  method: "*"
  path: "/cc/*"
  auth_requirement: "session:persistent AND role:cc-operator (email in platform_admins, is_active=true)"
  authz_check_location: middleware
  authz_check_detail: "finbot/apps/cc/main.py:28-34 app-wide @app.middleware('http'); applies before any router/dependency runs"
  reachability: {status: blocked_by_control, notes: "confirmed live: fresh session -> 403 on every /cc/* path tried (/cc/, implies all children)"}
  visibility: black_box_observable
  evidence: {black_box: "curl fresh cookies -> GET /cc/ -> HTTP 403 branded Access Denied page", source_ref: "finbot/apps/cc/main.py:28-34; finbot/apps/cc/auth.py:76-100"}
  notes: >
    Recorded as one boundary record rather than duplicated per child route,
    since the gate is uniform and app-wide, unlike every other subsystem in
    this ground truth where authz is per-route (or absent).

