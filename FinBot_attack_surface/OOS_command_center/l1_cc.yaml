  interaction_type: http_route
  method: GET
  path: /cc/
  reachability: {status: blocked_by_control, notes: "see cc.access_boundary"}
  visibility: white_box_required
  evidence: {source_ref: "finbot/apps/cc/routes/dashboard.py:54"}

