- id: ctf.api.share.profile_card
  component: ctf
  direction: entry
  interaction_type: http_route
  method: GET
  path: /ctf/api/v1/profile/{username}/card.png
  parameters:
    - {name: username, location: path, type: string, required: true}
    - {name: html, location: query, type: bool, required: false, source: "default false; true returns raw HTML instead of rendered PNG -- documented as 'debug mode'"}
  auth_requirement: "none"
  authz_check_location: none
  authz_check_detail: >
    Only `db: Session = Depends(get_db)` -- NO session_context dependency
    at all, unlike every other route catalogued across this entire
    platform. Genuinely anonymous, unauthenticated, no session cookie
    required or even set.
  reachability: {status: black_box_reachable, notes: ""}
  visibility: black_box_observable
  evidence: {source_ref: "finbot/apps/ctf/routes/share.py:181-230ish; finbot/apps/ctf/rendering.py (Playwright renderer)"}
  notes: >
    Server-side HTML-to-PNG rendering (Playwright/Chromium) of a template
    populated with public-profile data (username, badges, completed
    challenges). Two things worth a closer follow-up pass, not confirmed
    exploitable here: (1) whether any of the interpolated profile fields
    (e.g. a player-chosen display name) are escaped before being placed
    into the rendered HTML template, since this is a genuine SSR-to-image
    pipeline and template/HTML injection here would be a real, publicly
    reachable finding, not merely a CTF-internal one; (2) the `html=true`
    debug switch returning raw markup is itself a bigger recon surface
    than the PNG output for probing (1).

