# L1 ground truth — CTF Portal (finbot/apps/ctf), mounted at /ctf
# Scoring, challenges, badges, profile, activity feed, and the Hacker
# Toolkit's CTF-portal-side twin (toolkit.py mirrors darklab's toolkit.py —
# same DeadDrop/ExfilData models, likely the same underlying repos; not
# independently diffed line-by-line against darklab_portal/l1_darklab.yaml
# in this pass, flagged as a duplication to verify rather than asserted
# identical). Same bare get_session_context auth posture as vendor/admin/
# darklab/labs throughout, EXCEPT the share-card routes, which have no
# session dependency at all — genuinely public, unauthenticated, exact
# fully-anonymous requests.

