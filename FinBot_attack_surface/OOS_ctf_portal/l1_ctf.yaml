- id: ctf.api.challenges.list
  component: ctf
  interaction_type: http_route
  method: GET
  path: /ctf/api/v1/challenges
  parameters:
    - {name: category, location: query, type: "string|null", required: false}
    - {name: difficulty, location: query, type: "string|null", required: false}
    - {name: status, location: query, type: "string|null", required: false}
  auth_requirement: "session:temporary"
  authz_check_location: none
  reachability: {status: black_box_reachable, notes: ""}
  visibility: black_box_observable
  evidence: {source_ref: "finbot/apps/ctf/routes/challenges.py:81-124"}
  notes: "This endpoint (plus challenges.get below) is effectively the ground-truth CATALOG itself, served to any session — an unauthenticated/low-friction black-box tester can enumerate every challenge id, hint cost, and (per-item) labels/prerequisites/detector-adjacent metadata simply by browsing here, without needing white-box repo access at all. Materially changes several visibility ratings elsewhere in this dataset from grey/white-box to black-box-observable-via-this-endpoint -- worth reconciling in a later consistency pass rather than silently re-labeling already-written records."

- id: ctf.api.challenges.get
  component: ctf
  interaction_type: http_route
  method: GET
  path: /ctf/api/v1/challenges/{challenge_id}
  parameters: [{name: challenge_id, location: path, type: string, required: true}]
  auth_requirement: "session:temporary"
  authz_check_location: none
  reachability: {status: black_box_reachable, notes: ""}
  visibility: black_box_observable
  evidence: {source_ref: "finbot/apps/ctf/routes/challenges.py:125-208"}
  notes: "Returns full description, hints array, labels, prerequisites, resources -- i.e. the ENTIRE challenge YAML content except detector_class/detector_config (server-side-only fields per the ChallengeDetail model at line 37-60, which omits them). Confirms detector internals specifically are the one thing intentionally kept white-box-only even though everything else about a challenge is black-box-observable by design."

- id: ctf.api.challenges.check
  component: ctf
  interaction_type: http_route
  method: POST
  path: /ctf/api/v1/challenges/{challenge_id}/check
  parameters: [{name: challenge_id, location: path, type: string, required: true}]
  auth_requirement: "session:temporary"
  authz_check_location: in_handler
  authz_check_detail: "explicit `if not session_context: raise 401` despite get_session_context always returning a context object for any request that reached this far -- effectively dead code, not a real gate"
  state_preconditions: ["CSRF token header present"]
  reachability: {status: black_box_reachable, notes: ""}
  visibility: black_box_observable
  evidence: {source_ref: "finbot/apps/ctf/routes/challenges.py:210-258"}
  notes: >
    Does NOT run detection itself -- it reflects UserChallengeProgress rows
    already written by the async event-pipeline (finbot/ctf/processor +
    detectors), and records a `record_attempt` side effect on every call
    regardless of outcome. This is the black-box "did I win yet" polling
    endpoint referenced throughout l2_full_catalog.yaml's observable_evidence
    fields.

