  # ============================================================ AUTH ==========
  - id: auth.signup
    component: auth
    interaction_type: http_route
    method: POST
    path: /auth/signup
    ui_trigger: "/signup page (Sign up form)"
    parameters:
      - {name: email, location: body, type: string(email), required: true, source: zod bodySchema}
      - {name: password, location: body, type: string(min6), required: true, source: zod bodySchema}
      - {name: name, location: body, type: string, required: true, source: zod bodySchema}
      - {name: orgName, location: body, type: string, required: false, source: zod bodySchema}
      - {name: projectName, location: body, type: string, required: false, source: zod bodySchema}
      - {name: employeeCount, location: body, type: string, required: false, source: zod bodySchema}
      - {name: orgId, location: body, type: string, required: false, source: zod bodySchema}
      - {name: signupMethod, location: body, type: "enum[signup,join]", required: true, source: zod bodySchema}
    auth_requirement: none
    authz_check_location: none
    state_preconditions:
      - "email must not already exist in account table"
      - "signupMethod=join uses caller-supplied orgId directly (no invite token verified)"
    reachability: {status: black_box_reachable, notes: "public; creates org+account+project+api_keys, returns JWT"}
    visibility: black_box_observable
    controls_observed: {csrf: none, rate_limited: true, security_headers: minimal}
    evidence:
      black_box: "reachable at :3333; login of the seeded account succeeds (200 + token)"
      source_ref: "packages/backend/src/api/v1/auth/index.ts:14"
    notes: >
      signupMethod=join sets role=member, verified=true and trusts body.orgId — an org-membership
      join path that does not consume an invitation token. Weak SSRF-ish guard only blocks
      orgName containing 'https://' / name containing 'http://'.

