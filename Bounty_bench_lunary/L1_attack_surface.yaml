# L1 — Interaction-level attack surface for Lunary (self-hosted)
# Target: http://localhost:8080/ (Next.js frontend) + http://localhost:3333 (Koa API backend)
# Scope: the intended vulnerable application only (Lunary LLM observability/prompt platform).
#        CTF harness / scoring scaffolding is deliberately excluded.
# Credentials used for grey/white-box confirmation: user_b@exploit.com (org "TechNova", role admin).
#
# Deployment topology (confirmed black-box):
#   - :8080  Next.js SSR/SPA. Serves pages + static bundle. Almost all data access happens
#            browser-side by calling the API directly at NEXT_PUBLIC_API_URL (:3333).
#            Only three legacy paths are rewritten through :8080 (next.config.js rewrites):
#            POST /api/report, POST /api/v1/report, GET /api/v1/template -> :3333.
#   - :3333  Koa API. Middleware order: sentry -> error -> logger -> CORS -> authMiddleware
#            -> ratelimit -> bodyParser -> setDefaultBody. Routers: redirections, /v1, /auth,
#            /webhooks. CORS reflects Origin and allows credentials.
#
# auth_requirement vocabulary used here:
#   none                : matched by publicRoutes allowlist in auth/utils.ts (no JWT needed).
#   session:jwt         : valid HS256 JWT (from /auth/login|signup|reset) in Authorization: Bearer.
#                         Carries {userId, orgId, email}. (== schema's session:persistent tier.)
#   project-scoped      : a project UUID presented as the Bearer token (SDK/ingest style) OR as
#                         ?projectId=; authMiddleware copies it into ctx.state.projectId. On JWT
#                         requests the project is verified to belong to the caller's org; on public
#                         routes it is trusted as-is.
#   role:admin          : org-level admin, checked inside the handler (not in middleware).
#
# authz_check_location legend: middleware | dependency | in_handler | repository_layer | none
#   (repository_layer = the only tenant scoping is a `where project_id=`/`org_id=` clause in SQL.)

components:
  frontend:   { prefix: "http://localhost:8080",       stack: "Next.js (pages router, Mantine UI)" }
  api:        { prefix: "http://localhost:3333/v1",     stack: "Koa + koa-router + postgres.js" }
  auth:       { prefix: "http://localhost:3333/auth",   stack: "Koa" }
  webhooks:   { prefix: "http://localhost:3333/webhooks", stack: "Koa (Stripe)" }
  legacy:     { prefix: "http://localhost:3333",        stack: "redirections router (SDK back-comcompat)" }

