# L1 — Interaction-level attack surface schema
# One record = one concrete web interaction (HTTP route, WebSocket, SSE stream,
# static asset, or MCP tool endpoint) that a tester can discover and invoke.
#
# Derived from the OWASP Attack Surface Analysis Cheat Sheet, refined against
# OWASP FinBot CTF (finbot/apps/*). Changes from the ASA baseline are noted
# inline as [kept] / [modified] / [added] / [removed].

fields:
  id:
    status: added
    type: string
    desc: >
      Stable identifier, e.g. "vendor.api.invoices.create". Lets L2 records
      reference the L1 interactions that realize a semantic operation.

  component:
    status: added
    type: string
    desc: >
      Which mounted sub-application owns this interaction (vendor, admin, cc,
      ctf, darklab, labs, finbot, web/demo). The ASA cheat sheet assumes a
      single monolithic app; this platform is a tree of FastAPI apps mounted
      under distinct path prefixes with different auth postures, so the
      component itself is part of the attack surface (e.g. /cc is only
      mounted when CC_ENABLED, and returns 403 site-wide when reached
      without the required grant).

  direction:
    status: added
    type: enum [entry, exit, bidirectional]
    desc: >
      ASA distinguishes "entry points" and "exit points" but treats them as
      separate catalogs. In an agentic app the same MCP tool can be an exit
      point in one context (e.g. systemutils.network_request used as an
      exfil channel) and effectively unreachable directly by a human in
      another. Kept as a single field per item rather than two catalogs so
      L1 stays one flat list.

  interaction_type:
    status: modified
    type: enum [http_route, websocket, sse_stream, static_asset, mcp_tool, agent_tool_call]
    desc: >
      ASA's "entry point" is too coarse once agent-mediated tool calls are
      in scope: an MCP tool is never reached by a browser request at all,
      only by an LLM's tool-call decision, and its parameter surface is a
      JSON schema, not HTTP params.

  method:
    status: kept
    type: string
    desc: HTTP verb, or "TOOL_CALL" for mcp_tool/agent_tool_call items.

  path:
    status: kept
    type: string
    desc: Full path as mounted (e.g. /vendor/api/v1/invoices/{invoice_id}).

  ui_trigger:
    status: added
    type: string | null
    desc: >
      Which page/button/form surfaces this interaction in the deployed
      frontend, or null for "no UI trigger — API/tool-only". ASA doesn't
      distinguish discoverable-by-clicking-around from
      discoverable-only-by-reading-the-OpenAPI-schema/source; this field
      makes that distinction explicit and feeds directly into reachability.

  parameters:
    status: kept, structured
    type: list[{name, location, type, required, source}]
    desc: >
      location: path | query | body | header | cookie.
      source: the Pydantic model name backing body params, where applicable.

  auth_requirement:
    status: modified
    type: string
    desc: >
      Replaces ASA's abstract "trust level" scale with the concrete tiers
      this app actually implements: none, session:temporary (anonymous,
      auto-created cookie, no email binding), session:persistent
      (get_authenticated_session_context — requires magic-link email
      bind), role:<name> (vendor / admin / cc-operator). An abstract
      numeric trust level doesn't map cleanly onto a system with two
      session tiers plus per-namespace data isolation.

  authz_check_location:
    status: added
    type: enum [middleware, dependency, in_handler, repository_layer, none]
    desc: >
      Where the access-control decision actually happens. This matters
      because in-handler and repository-layer checks are where authz bugs
      hide, and because the same nominal "auth_requirement" can be enforced
      inconsistently across sibling endpoints (observed directly in this
      app — see vendor.api.dashboard.metrics in l1_api.yaml, which omits a
      guard its sibling endpoints all have).

  state_preconditions:
    status: added
    type: list[string]
    desc: >
      Non-auth state required for the interaction to behave as intended,
      e.g. "vendor context selected (current_vendor_id set)", "CSRF token
      present", "CC_ENABLED feature flag set at deploy time".

  reachability:
    status: added
    type: object {status, notes}
    desc: >
      status: black_box_reachable | requires_guessed_path |
      conditionally_mounted | blocked_by_control | unreachable_in_source.
      Kept strictly separate from `visibility` per project requirement: an
      item can be white-box-only to *discover* yet black-box-reachable
      once its path is known (e.g. /demo/cineflow), or white-box-visible in
      source yet black-box-unreachable in this deployment (e.g. /cc when
      CC_ENABLED=false).

  visibility:
    status: added
    type: enum [black_box_observable, grey_box_required, white_box_required]
    desc: >
      Minimum access needed to learn this interaction *exists* (not to use
      it). black_box_observable = found via normal navigation, form
      inspection, or generic endpoint discovery (e.g. FastAPI default
      /docs if enabled, robots.txt, JS bundle). grey_box_required =
      needs a valid session/role to see it (e.g. a nav item only rendered
      for admins) or needs directory brute-forcing to find an unlinked
      path. white_box_required = only visible by reading source/config
      (e.g. a route gated by a feature flag that's off, or an MCP tool
      never wired into any agent's toolset).

  controls_observed:
    status: added
    type: object {csrf, rate_limited, security_headers}
    desc: Black-box-confirmed presence/absence of cross-cutting controls.

  evidence:
    status: added
    type: object {black_box, source_ref}
    desc: >
      black_box: how it was confirmed live (curl transcript summary,
      status code). source_ref: file:line for white-box confirmation.
      Both may be present; an item is only claimed black_box_observable
      if `evidence.black_box` is populated from an actual probe, not
      inferred from source.

  notes:
    status: added
    type: string
    desc: Free text — anomalies, inconsistencies with sibling endpoints, etc.


